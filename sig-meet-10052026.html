<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Signature Society · Meeting Agenda · Oct 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/hqq5dii.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
  :root{
    color-scheme:dark;
    --color1-900:#030811; --color1-800:#08142B; --color1-700:#192D54;
    --color5-50:#F5F2EB; --color5-100:#E1D8C9; --color5-300:#AB946E; --color5-400:#C3AD79; --color5-500:#A69263; --color5-700:#6C5D3B;
    --neutral-50:#FBFCFC; --neutral-100:#EDEEEF; --neutral-300:#C4C6C9; --neutral-400:#A6A9AB; --neutral-500:#8A8D90; --neutral-600:#646769; --neutral-800:#2C2E30;
    --color3-600:#803D3D; --color3-700:#5F2426;
    --danger:#C97A6D;

    --ff-display:"kepler-std-display",'Times New Roman',Times,serif;
    --ff-subhead:"kepler-std-subhead",'Times New Roman',Times,serif;
    --ff-base:"kepler-std",'Times New Roman',Times,serif;
    --ff-sm:"kepler-std-caption",'Times New Roman',Times,serif;
    --ff-inter:"inter-18pt","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

    --fw-display:400; --fw-subhead:400;
    --fw-base-normal:300; --fw-sm-link:500;
    --ease-ui:160ms ease;

    --text-default:var(--color5-50);
    --text-subtle:var(--color5-300);
    --text-muted:var(--color5-500);
    --text-neutral-light:var(--neutral-100);
    --text-neutral:var(--neutral-300);
    --text-neutral-muted:var(--neutral-600);
    --border-default:var(--color5-300);
    --border-neutral:var(--neutral-800);
    --icon-light:var(--color5-100);
    --icon-accent:var(--color5-300);
    --icon-muted:var(--neutral-600);
    --btn-bg-default:var(--color3-700);
    --btn-bg-hover:var(--color3-600);
    --btn-text:var(--neutral-50);
  }

  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    margin:0;
    background:#010515;
    color:var(--text-neutral);
    font-family:var(--ff-base);
    font-weight:var(--fw-base-normal);
    font-size:1rem;
    line-height:1.5;
    letter-spacing:.015em;
  }
  [hidden]{display:none !important;}

  .wrap{max-width:64rem;margin:0 auto;padding:2rem 1.25rem 5rem;}
  @media (min-width:700px){ .wrap{padding:3rem 2rem 6rem;} }
  @media (min-width:1000px){ .wrap{padding:3.5rem 3rem 7rem;} }

  /* Link buttons */
  .files-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;margin-bottom:3rem;}
  .files-bar:empty{display:none;}
  .btn{
    display:inline-block;
    background:var(--btn-bg-default);
    color:var(--btn-text);
    text-decoration:none;
    font-family:var(--ff-sm);
    font-weight:var(--fw-sm-link);
    font-size:.765rem;
    line-height:1;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:.8rem 1.5rem;
    border:1px solid var(--btn-bg-default);
    transition:background var(--ease-ui),border-color var(--ease-ui);
  }
  .btn:hover{background:var(--btn-bg-hover);border-color:var(--btn-bg-hover);}
  .btn:focus-visible{outline:2px solid var(--btn-text);outline-offset:3px;}

  /* Header */
  header{padding:1rem 0 1.5rem;margin-bottom:2.5rem;}
  h1,h6{font-weight:var(--fw-display);text-transform:uppercase;letter-spacing:.08em;margin:0 0 1.25rem;text-wrap:balance;}
  h1{font-family:var(--ff-display);font-size:clamp(2.6rem,8vw,4.294rem);line-height:1.2;color:var(--text-default);}
  h6{font-family:var(--ff-subhead);font-size:1.412rem;line-height:1.4;color:var(--text-default);margin:0;}

  /* Shown above the sections only when answers can't load */
  .notes-status{margin:0 0 .75rem;font-family:var(--ff-inter);font-size:.75rem;color:var(--danger);}
  .notes-status:empty{margin:0;}

  .link-btn{
    -webkit-appearance:none;appearance:none;
    background:none;border:none;padding:0;
    font-family:var(--ff-inter);font-size:.75rem;letter-spacing:.02em;
    color:var(--neutral-500);
    cursor:pointer;
    transition:color var(--ease-ui);
  }
  .link-btn:hover{color:var(--color5-300);}
  .link-btn:focus-visible{outline:2px solid var(--color5-300);outline-offset:2px;}
  .link-btn.is-warning{color:var(--danger);}

  .caret{display:flex;flex:none;align-self:center;color:var(--icon-accent);line-height:0;}
  .caret svg{display:block;width:14px;height:14px;transition:transform 200ms ease;}
  [aria-expanded="true"] > .caret svg{transform:rotate(180deg);}
  @media (prefers-reduced-motion:reduce){ .caret svg{transition:none;} }

  /* Sections: one row each until opened */
  .group{border-bottom:1px solid var(--border-neutral);}
  .sec-h{margin:0;font:inherit;}
  .sec-head{
    -webkit-appearance:none;appearance:none;
    display:flex;align-items:baseline;gap:1rem;
    width:100%;
    padding:1.1rem 0;
    background:none;border:none;
    text-align:left;
    cursor:pointer;
    font-family:var(--ff-subhead);
    font-weight:var(--fw-subhead);
    font-size:1.25rem;
    line-height:1.4;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-subtle);
    transition:color var(--ease-ui);
  }
  @media (min-width:700px){ .sec-head{font-size:1.5rem;} }
  .sec-head:hover,.sec-head[aria-expanded="true"]{color:var(--text-default);}
  .sec-head:focus-visible{outline:2px solid var(--color5-300);outline-offset:4px;}
  .sec-title{min-width:0;overflow-wrap:anywhere;}
  .sec-rule{flex:1;align-self:center;height:1px;min-width:1.5rem;background:var(--color5-700);}
  .sec-meta{
    flex:none;
    font-family:var(--ff-inter);font-size:.75rem;letter-spacing:.02em;text-transform:none;
    color:var(--neutral-500);
    white-space:nowrap;
  }
  @media (max-width:560px){
    .sec-head{flex-wrap:wrap;gap:.25rem 1rem;}
    .sec-title{flex:1 1 100%;}
    .sec-rule{display:none;}
    .sec-meta{flex:1;}
  }
  .sec-body{padding:0 0 1.75rem;}

  /* Items */
  ol.rows{list-style:none;margin:0;padding:0;}
  ol.rows > li{padding:.9rem 0 .9rem .25rem;border-bottom:1px solid var(--border-neutral);}
  ol.rows > li:last-child{border-bottom:none;}
  .item-head{
    -webkit-appearance:none;appearance:none;
    display:flex;align-items:baseline;gap:.75rem;
    width:100%;
    padding:0;
    background:none;border:none;
    text-align:left;
    font:inherit;color:inherit;
    cursor:pointer;
  }
  .item-head:focus-visible{outline:2px solid var(--color5-300);outline-offset:4px;}
  .item{display:block;flex:1;min-width:0;color:var(--text-neutral-light);font-size:1.118rem;overflow-wrap:anywhere;transition:color var(--ease-ui);}
  .item-head:hover .item{color:var(--text-default);}
  .item-body{padding:.25rem 0 .5rem;}

  /* Item row: title (opens the item), image icon, arrow */
  .item-row{display:flex;align-items:center;gap:.5rem;}
  .item-row .item-head{flex:1;min-width:0;}
  .item-caret{cursor:pointer;}
  .item-row.is-open .item-caret svg{transform:rotate(180deg);}
  .image-icon{
    -webkit-appearance:none;appearance:none;
    display:flex;align-items:center;justify-content:center;flex:none;
    width:28px;height:28px;padding:0;
    background:none;border:none;
    color:var(--icon-muted);line-height:0;cursor:pointer;
    transition:color var(--ease-ui);
  }
  .image-icon svg{display:block;width:17px;height:17px;}
  .image-icon:hover{color:var(--color5-300);}
  .image-icon.has-images{color:var(--color5-500);}
  .image-icon:focus-visible{outline:2px solid var(--color5-300);outline-offset:2px;}

  /* Image thumbnails inside an open item */
  .item-images{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1rem;}
  .item-images:empty{display:none;}
  .thumb-card{margin:0;width:120px;}
  .thumb-card.is-uploading{opacity:.55;}
  .thumb-open{
    display:block;width:120px;height:120px;padding:0;
    background:var(--color1-900);
    border:1px solid var(--color5-700);
    overflow:hidden;cursor:zoom-in;
    transition:border-color var(--ease-ui);
  }
  .thumb-open:hover{border-color:var(--color5-300);}
  .thumb-open:focus-visible{outline:2px solid var(--color5-300);outline-offset:2px;}
  .thumb-open img{display:block;width:100%;height:100%;object-fit:cover;}
  .thumb-card figcaption{
    margin-top:.35rem;
    font-family:var(--ff-inter);font-size:.75rem;line-height:1.4;
    color:var(--neutral-300);
    overflow-wrap:anywhere;
  }

  /* Full-size image view with its title, description and Remove */
  .image-view img{max-height:58vh;}
  .image-view-fields{
    display:flex;flex-direction:column;gap:.5rem;
    width:min(560px,100%);
    cursor:auto;
    font-family:var(--ff-inter);
  }
  .image-view-fields label{
    font-size:.6875rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
    color:var(--text-muted);
  }
  .image-view-fields input,.image-view-fields textarea{
    width:100%;
    background:var(--color1-900);
    border:1px solid var(--neutral-800);
    color:var(--neutral-100);
    font-family:var(--ff-inter);font-size:.9375rem;line-height:1.5;
    padding:.55rem .7rem;
    transition:border-color var(--ease-ui);
  }
  .image-view-fields textarea{min-height:5.5rem;resize:vertical;}
  .image-view-fields input:focus,.image-view-fields textarea:focus{outline:none;border-color:var(--color5-400);}
  .image-view-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;}
  .image-view-status{font-size:.75rem;color:var(--neutral-500);}
  .image-view-status[data-state="error"]{color:var(--danger);}
  .image-view-actions{display:flex;gap:.5rem;}
  .ghost.is-warning{border-color:var(--danger);color:var(--danger);}
  .ghost.is-warning:hover{background:var(--danger);color:var(--color1-900);}

  .item-note{
    margin:.6rem 0 0;
    font-family:var(--ff-sm);font-size:.8125rem;line-height:1.5;letter-spacing:.02em;
    color:var(--neutral-400);
  }
  .item-details{
    margin-top:.75rem;
    padding:.25rem 0 .25rem 1rem;
    max-width:620px;
    color:var(--text-neutral);
    border-left:1px solid var(--color5-700);
    overflow-wrap:anywhere;
  }
  .item-details > * + *{margin-top:.75rem;}
  .item-details p{margin:0;}
  .item-details ul{margin:0;padding-left:1.1rem;list-style:disc;}
  .item-details ul li{padding-left:.2rem;}
  .item-details ul li + li{margin-top:.5rem;}
  .item-details ul li::marker{color:var(--color5-500);}

  /* Confirm: Yes / Add Notes on each point, and the Notes box Add Notes opens */
  .confirm-pair{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0 0;}
  .confirm-pair:empty{display:none;}
  .confirm-btn{
    -webkit-appearance:none;appearance:none;
    background:none;
    border:1px solid var(--color5-700);border-radius:999px;
    padding:.05rem .55rem;
    font-family:var(--ff-inter);font-size:.6875rem;font-weight:500;letter-spacing:.03em;line-height:1.45;
    color:var(--neutral-500);
    cursor:pointer;
    transition:color var(--ease-ui),border-color var(--ease-ui),background var(--ease-ui);
  }
  .confirm-btn:hover{color:var(--color5-300);border-color:var(--color5-300);}
  .confirm-btn:focus-visible{outline:2px solid var(--color5-300);outline-offset:2px;}
  .confirm-btn.is-yes.is-on{background:var(--color5-700);border-color:var(--color5-700);color:var(--color5-50);}
  .confirm-btn.is-no.is-on{background:var(--color3-700);border-color:var(--color3-700);color:var(--neutral-50);}
  .note-icon{
    -webkit-appearance:none;appearance:none;
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;margin-left:.35rem;padding:0;
    vertical-align:middle;
    background:none;border:none;
    color:var(--icon-muted);line-height:0;cursor:pointer;
    transition:color var(--ease-ui);
  }
  .note-icon svg{display:block;width:15px;height:15px;}
  .note-icon:hover,.note-icon[aria-expanded="true"]{color:var(--color5-300);}
  .note-icon.has-notes{color:var(--color5-500);}
  .note-icon:focus-visible{outline:2px solid var(--color5-300);outline-offset:2px;}
  .point-notes{margin:.65rem 0 .25rem;max-width:620px;}
  .point-notes-label{
    display:block;margin:0 0 .35rem;
    font-family:var(--ff-inter);font-size:.6875rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
    color:var(--text-muted);
  }
  .point-notes-input{
    display:block;width:100%;
    min-height:8rem;resize:vertical;
    background:var(--color1-900);
    border:1px solid var(--neutral-800);
    color:var(--neutral-100);
    font-family:var(--ff-inter);font-size:.9375rem;line-height:1.55;
    padding:.7rem .8rem;
    transition:border-color var(--ease-ui);
  }
  .point-notes-input:focus{outline:none;border-color:var(--color5-400);}
  .point-notes-status{display:block;min-height:1.1em;margin-top:.3rem;font-family:var(--ff-inter);font-size:.75rem;color:var(--neutral-500);}
  .point-notes-status[data-state="error"]{color:var(--danger);}

  /* Attachments */
  .attach{display:flex;flex-wrap:wrap;align-items:center;gap:.625rem;margin-top:.75rem;}
  .attach:empty{display:none;}
  .chip,.thumb{position:relative;display:inline-flex;align-items:center;}
  .item-link{
    font-family:var(--ff-sm);font-size:.8rem;letter-spacing:.033em;
    color:var(--color5-300);text-decoration:none;
    border-bottom:1px solid var(--color5-700);
    white-space:nowrap;
    transition:border-color var(--ease-ui);
  }
  .item-link:hover{border-bottom-color:var(--color5-300);}
  .item-link:focus-visible{outline:2px solid var(--color5-300);outline-offset:3px;}
  .attachment-pill{
    display:inline-flex;align-items:center;
    padding:0;border:none;background:transparent;
    color:var(--neutral-400);
    font-family:var(--ff-sm);font-size:.75rem;letter-spacing:.02em;
    max-width:22ch;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    border-bottom:1px dotted var(--neutral-600);
    cursor:zoom-in;
    transition:color var(--ease-ui);
  }
  .attachment-pill:hover{color:var(--color5-300);}
  .attachment-pill:focus-visible{outline:2px solid var(--color5-300);outline-offset:3px;}

  .ghost{
    background:none;
    border:1px solid var(--color5-700);
    color:var(--color5-300);
    font-family:var(--ff-inter);
    font-size:.875rem;
    font-weight:500;
    letter-spacing:.033em;
    padding:.625rem .875rem;
    cursor:pointer;
    transition:background var(--ease-ui),color var(--ease-ui),border-color var(--ease-ui);
  }
  .ghost:hover{background:var(--color5-400);border-color:var(--color5-400);color:var(--color1-900);}
  .ghost:focus-visible{outline:2px solid var(--color5-300);outline-offset:2px;}
  .ghost:disabled{opacity:.5;cursor:default;}
  .ghost.small{font-size:.8125rem;padding:.45rem .8rem;}
  .ghost.quiet{border-color:transparent;color:var(--neutral-500);}
  .ghost.quiet:hover{background:none;border-color:transparent;color:var(--color5-300);}

  /* Full size image view */
  .lightbox{
    position:fixed;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.65rem;
    padding:3rem 1.5rem;
    background:rgba(3,8,17,.94);
    cursor:zoom-out;
  }
  .lightbox img{max-width:100%;min-height:0;flex:0 1 auto;object-fit:contain;border:1px solid var(--color5-700);}
  .lightbox-name,.lightbox-caption{flex:none;max-width:60ch;font-family:var(--ff-sm);text-align:center;padding:.2rem .5rem;outline:none;border-bottom:1px solid transparent;}
  .lightbox-name{font-size:.875rem;letter-spacing:.02em;color:var(--color5-300);}
  .lightbox-caption{font-size:.75rem;line-height:1.7;letter-spacing:.09em;text-transform:uppercase;color:var(--neutral-400);}
  .lightbox-name[contenteditable],.lightbox-caption[contenteditable]{cursor:text;border-bottom-color:var(--color5-700);}
  .lightbox-name[contenteditable]:focus,.lightbox-caption[contenteditable]:focus{border-bottom-color:var(--color5-300);}
  .lightbox-name:empty::before,.lightbox-caption:empty::before{content:attr(data-placeholder);color:var(--color5-500);}

  /* ---- Edit mode (only after unlocking with a GitHub token) ---- */
  .editing .group{border-bottom:none;margin-bottom:3rem;}
  .edit-sec-head{
    display:flex;align-items:baseline;gap:1rem;
    margin:0 0 .75rem;
    font-family:var(--ff-subhead);font-weight:var(--fw-subhead);
    font-size:1.419rem;line-height:1.45;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-subtle);
  }
  .edit-sec-head::after{content:"";flex:1;order:1;height:1px;min-width:2rem;background:var(--border-default);}
  .editing ol.rows > li{display:flex;align-items:baseline;gap:1.25rem;}
  .row-main{flex:1;min-width:0;}

  .editing [contenteditable]{outline:none;border-bottom:1px solid transparent;caret-color:var(--color5-300);transition:border-color var(--ease-ui);}
  .editing [contenteditable]:hover{border-bottom-color:var(--color1-700);}
  .editing [contenteditable]:focus{border-bottom-color:var(--color5-300);}
  .editing [contenteditable]:empty::before{content:attr(data-placeholder);color:var(--text-neutral-muted);}
  .editing .item-details[contenteditable]{border-bottom:none;}
  .editing .item-details[contenteditable]:hover{border-left-color:var(--color5-500);}
  .editing .item-details[contenteditable]:focus{border-left-color:var(--color5-300);}
  .editing .item-details[contenteditable]:empty::before{color:var(--text-muted);}
  .editing .item-details > div + div{margin-top:.5rem;}
  .editing .item-note[contenteditable]:empty::before{color:var(--neutral-600);}

  .field{
    min-width:0;
    background:transparent;
    border:none;border-bottom:1px solid var(--neutral-800);
    padding:.35rem .1rem;
    font-family:var(--ff-inter);font-size:.8125rem;
    color:var(--text-neutral-light);
    transition:border-color var(--ease-ui);
  }
  .field::placeholder{color:var(--text-neutral-muted);}
  .field:focus{outline:none;border-bottom-color:var(--color5-300);}

  .files-bar.is-editing{flex-direction:column;align-items:stretch;gap:.5rem;max-width:34rem;}
  .link-edit{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr) auto;gap:.75rem;align-items:center;}
  @media (max-width:520px){ .link-edit{grid-template-columns:minmax(0,1fr) auto;} .link-edit .field-url{grid-column:1;grid-row:2;} }

  .sec-actions,.row-actions{display:flex;align-items:center;gap:.125rem;}
  .sec-actions{order:2;align-self:center;}
  .row-actions{align-self:flex-start;opacity:0;transition:opacity var(--ease-ui);}
  li:hover > .row-actions,li:focus-within > .row-actions{opacity:1;}
  @media (hover:none){ .row-actions{opacity:1;} }

  .row-btn,.chip-x{
    -webkit-appearance:none;appearance:none;
    display:flex;align-items:center;justify-content:center;
    padding:0;background:none;border:none;
    color:var(--icon-muted);line-height:0;cursor:pointer;
    transition:color var(--ease-ui),border-color var(--ease-ui);
  }
  .row-btn{width:32px;height:32px;}
  .row-btn svg{display:block;width:18px;height:18px;}
  .row-btn:hover{color:var(--color5-300);}
  .row-btn.is-delete:hover{color:var(--danger);}
  .row-btn:disabled{opacity:.3;cursor:default;}
  .row-btn:disabled:hover{color:var(--icon-muted);}
  .row-btn:focus-visible,.chip-x:focus-visible{outline:2px solid var(--color5-300);outline-offset:2px;}
  .chip-x{
    position:absolute;top:-8px;right:-11px;
    width:18px;height:18px;
    background:var(--color1-900);
    border:1px solid var(--color5-700);border-radius:50%;
    color:var(--neutral-400);
  }
  .chip-x svg{width:10px;height:10px;}
  .chip-x:hover{color:var(--color5-300);border-color:var(--color5-300);}
  .editing .chip,.editing .thumb{margin-right:.5rem;}

  .attach-tools{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;margin-top:.75rem;}
  .attach-tools .field{flex:1 1 14rem;}

  .add-row{
    -webkit-appearance:none;appearance:none;
    display:inline-flex;align-items:center;gap:.5rem;
    background:none;border:none;
    margin-top:.75rem;padding:.25rem;
    font-family:var(--ff-sm);font-size:.875rem;letter-spacing:.015em;
    color:var(--text-muted);cursor:pointer;
    transition:color var(--ease-ui);
  }
  .add-row svg{display:block;width:14px;height:14px;flex:none;}
  .add-row:hover{color:var(--text-subtle);}
  .add-row:focus-visible{outline:2px solid var(--color5-300);outline-offset:3px;}
  .add-section{margin-top:0;font-size:1rem;color:var(--text-subtle);}

<script>

  var editing = false;
  var undoStack = [];
  var previews = {};   // image path -> local data URL, until Pages publishes the file
  // Which sections and items are open. Every visit starts with everything closed;
  // this only keeps the page steady while it's open (for example after Lock).
  var open = {sections: {}, items: {}};

  function flash(message) {
    toast.textContent = message;
    toast.classList.add("is-visible");

  function readLocal(key, fallback) {
    try {
      var v = JSON.parse(localStorage.getItem(key) || "null");
      return v == null ? fallback : v;
    } catch (e) {
      return fallback;
    }
  }

  function writeLocal(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {}
  }

  /* ---- Data ---------------------------------------------------------- */

  function uid(prefix) {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function normalizeItem(item) {
    item = item || {};
    return {
      id: item.id || uid("i"),
      text: item.text || "",
      info: !!item.info,         // a reference item: its points are facts, so they get no Confirmed button
      note: item.note || "",
      details: item.details || "",
      links: (item.links || []).filter(Boolean),
      images: (item.images || []).filter(function (i) { return i && i.src; }).map(function (i) {
        return {src: i.src, name: i.name || "", caption: i.caption || ""};
      })
    };
  }

  function normalizeDoc(d) {
    d = d || {};
    return {
      title: d.title || "",
      date: d.date || "",
      links: (d.links || []).map(function (l) { return {label: l.label || "", href: l.href || ""}; }),
      sections: (d.sections || []).map(function (s) {
        return {id: s.id || uid("s"), title: s.title || "", items: (s.items || []).map(normalizeItem)};
      })
    };
  }

  function isBlank(item) {
    return !item.text && !item.note && !item.details && !item.links.length && !item.images.length;
  }

  // Before any change that adds, removes or moves something, so Undo can step back.
  function snapshot() {
    undoStack.push(JSON.stringify(data));
    if (undoStack.length > 40) {
      undoStack.shift();
    }
    updateUndo();
  }

  /* ---- Markup -------------------------------------------------------- */

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function safeHref(href) {
    href = String(href || "").trim();
    if (!href || /^(javascript|data|vbscript):/i.test(href)) {
      return "#";
    }
    return href;
  }

  function normUrl(v) {
    v = String(v || "").trim();
    if (!v) {
      return "";
    }
    if (!/^([a-z][a-z0-9+.-]*:|\/|#)/i.test(v)) {
      v = "https://" + v;
    }
    return v;
  }

  function linkLabel(href) {
    try {
      return new URL(href, location.href).hostname.replace(/^www\./, "") || "link";
    } catch (e) {
      return "link";
    }
  }

  function imageSrc(src) {
    return previews[src] || src;
  }

  var BULLET = /^\s*[-–•]\s+(.*)$/;

  // A short hash of a point's text, so a confirmation stays with the wording it confirmed.
  function textKey(text) {
    var h = 5381;
    for (var i = 0; i < text.length; i++) {
      h = ((h << 5) + h + text.charCodeAt(i)) >>> 0;
    }
    return h.toString(36);
  }

  // One point that can be answered: its text, the Confirm: Yes and Add Notes buttons,
  // and the Notes box that opens when the answer is No.
  function pointMarkup(ctx, text) {
    var key = ctx.item + "~" + textKey(text);
    points[key] = {item: ctx.item, itemTitle: ctx.itemTitle, section: ctx.section, text: text};
    if (!STORE_URL) {
      return esc(text);
    }
    var c = confirms[key];
    return esc(text) +
      '<span class="confirm-pair" data-confirm="' + esc(key) + '">' + confirmButtons(key) + "</span>" +
      notesBoxMarkup(key, answerOf(c) === "no");
  }

  // A point on a reference item: a fact, so no Confirm buttons, just a note icon
  // that opens the same Notes box. It starts open when the point already has notes.
  function refPointMarkup(ctx, text) {
    var key = ctx.item + "~" + textKey(text);
    points[key] = {item: ctx.item, itemTitle: ctx.itemTitle, section: ctx.section, text: text, ref: true};
    if (!STORE_URL) {
      return esc(text);
    }
    if (refOpen[key] === undefined) {
      refOpen[key] = hasNotes(key);
    }
    return esc(text) +
      '<button type="button" class="note-icon' + (hasNotes(key) ? " has-notes" : "") + '" data-note-key="' + esc(key) + '"' +
        ' aria-expanded="' + refOpen[key] + '" aria-controls="pnw-' + esc(key) + '" title="Add a note" aria-label="Add a note">' + ICONS.note + "</button>" +
      notesBoxMarkup(key, refOpen[key]);
  }

  function notesBoxMarkup(key, shown) {
    var k = esc(key);
    var c = confirms[key];
    return '<div class="point-notes" id="pnw-' + k + '" data-notes="' + k + '"' + (shown ? "" : " hidden") + ">" +
        '<label class="point-notes-label" for="pn-' + k + '">Notes</label>' +
        '<textarea class="point-notes-input" id="pn-' + k + '" rows="5">' + esc((c && c.notes) || "") + "</textarea>" +
        '<span class="point-notes-status" data-notes-status="' + k + '" aria-live="polite"></span>' +
      "</div>";
  }

  // Lines starting with "- " become a bulleted list; everything else is a paragraph.
  // Each bullet can be answered. An item with no bullets can be answered line by line.
  function detailsMarkup(text, ctx) {
    var lines = text.split("\n");
    var hasBullets = lines.some(function (line) { return BULLET.test(line); });
    var out = "";
    var list = [];
    function flushList() {
      if (list.length) {
        out += "<ul>" + list.map(function (li) { return "<li>" + li + "</li>"; }).join("") + "</ul>";
        list = [];
      }
    }
    lines.forEach(function (line) {
      var bullet = line.match(BULLET);
      if (bullet) {
        list.push(ctx.info ? refPointMarkup(ctx, bullet[1].trim()) : pointMarkup(ctx, bullet[1].trim()));
        return;
      }
      flushList();
      if (!line.trim()) {
        return;
      }
      if (ctx.info) {
        out += '<div class="point">' + refPointMarkup(ctx, line.trim()) + "</div>";
      } else if (hasBullets) {
        out += "<p>" + esc(line) + "</p>";
      } else {
        out += '<div class="point">' + pointMarkup(ctx, line.trim()) + "</div>";
      }
    });
    flushList();
    return out;
  }

  function editLinesMarkup(text) {
    return text.split("\n").map(function (line) {
      return "<div>" + (line ? esc(line) : "<br>") + "</div>";
    }).join("");
  }

  function plural(n, word) {
    return n + " " + word + (n === 1 ? "" : "s");
  }

  function sectionMeta(sec) {
    return plural(sec.items.filter(function (i) { return !isBlank(i); }).length, "item");
  }

  function rowMarkup(item, gi, ii) {
    if (isBlank(item)) {
      return "";
    }
    var id = esc(item.id);
    var isOpen = !!open.items[item.id];
    var note = item.note ? '<p class="item-note">' + esc(item.note) + "</p>" : "";
    var details = item.details ? '<div class="item-details">' + detailsMarkup(item.details, {item: item.id, itemTitle: item.text, section: data.sections[gi].title, info: item.info}) + "</div>" : "";
    var links = item.links.map(function (href) {
      return '<a class="item-link" href="' + esc(safeHref(href)) + '" target="_blank" rel="noopener noreferrer">' + esc(linkLabel(href)) + " ↗</a>";
    }).join("");
    var pills = item.images.map(function (img, k) {
      return '<button type="button" class="attachment-pill" data-gi="' + gi + '" data-ii="' + ii + '" data-img="' + k + '" title="View full size">' + esc(img.name || "Image") + "</button>";
    }).join("");
    var attach = (links || pills) ? '<div class="attach">' + links + pills + "</div>" : "";
    var gallery = STORE_URL ? '<div class="item-images" data-images="' + id + '">' + imagesMarkup(item.id) + "</div>" : "";
    var body = note + details + attach + gallery;
    if (!body) {
      return '<li data-item="' + id + '"><div class="item-head"><span class="item">' + esc(item.text) + "</span></div></li>";
    }
    var icon = STORE_URL ? '<button type="button" class="image-icon' + (imagesFor(item.id).length ? " has-images" : "") + '"' +
      ' data-image-item="' + id + '" title="Add images" aria-label="Add images">' + ICONS.image + "</button>" : "";

      '<div class="item-body" id="ib-' + id + '"' + (isOpen ? "" : " hidden") + ">" + body + "</div>" +
    "</li>";
  }

  function sectionMarkup(sec, gi) {
    var id = esc(sec.id);
    var isOpen = !!open.sections[sec.id];

      '<h2 class="sec-h"><button type="button" class="sec-head" aria-expanded="' + isOpen + '" aria-controls="sb-' + id + '">' +

  function readMarkup(d) {

    b.type = "button";
    b.innerHTML = ICONS[name];
    b.title = label;
    b.setAttribute("aria-label", label);
    return b;
  }

  function addBtn(label, onClick, extra, icon) {
    var b = el("button", "add-row" + (extra ? " " + extra : ""));
    b.type = "button";
    b.innerHTML = ICONS[icon || "plus"] + "<span>" + esc(label) + "</span>";
    b.addEventListener("click", onClick);
    return b;
  }

  function focusEnd(node) {
    if (!node) {
      return;
    }
    node.focus();
    if (node.tagName === "INPUT" || node.tagName === "TEXTAREA") {
      return;
    }
    var range = document.createRange();
    range.selectNodeContents(node);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function plainPaste(event, singleLine) {
    event.preventDefault();
    var text = (event.clipboardData || window.clipboardData).getData("text");
    if (singleLine) {
      document.execCommand("insertText", false, text.replace(/\s+/g, " "));
      return;
    }
    text.replace(/\r\n?/g, "\n").split("\n").forEach(function (line, n) {
      if (n) {
        document.execCommand("insertParagraph", false);
      }
      if (line) {
        document.execCommand("insertText", false, line);
      }
    });
  }

  // A one line editable title. onKey returns true when it handled the key itself.
  function editableLine(node, placeholder, label, onText, onKey) {
    node.contentEditable = "true";
    node.setAttribute("role", "textbox");
    node.setAttribute("aria-label", label);
    node.setAttribute("data-placeholder", placeholder);
    node.addEventListener("input", function () {
      onText(node.textContent.replace(/\s+/g, " ").trim());
      save();
    });
    node.addEventListener("paste", function (event) { plainPaste(event, true); });
    node.addEventListener("keydown", function (event) {
      if (onKey && onKey(event)) {
        return;
      }
      if (event.key === "Enter" || event.key === "Escape") {
        event.preventDefault();
        node.blur();
      }
    });
    node.addEventListener("blur", function () {
      if (!node.textContent.trim()) {
        node.textContent = "";
      }
    });
  }

  function textField(id, value, placeholder, label, extra) {
    var i = el("input", "field" + (extra ? " " + extra : ""));
    i.type = "text";
    i.id = id;
    i.value = value || "";
    i.placeholder = placeholder;
    i.autocomplete = "off";
    i.setAttribute("aria-label", label);
    return i;
  }

  /* ---- Lightbox ------------------------------------------------------ */

  function openLightbox(image, onEdit) {
    var overlay = el("div", "lightbox");
    var img = el("img");
    img.src = imageSrc(image.src);
    img.alt = image.caption || image.name || "";
    overlay.appendChild(img);

    function line(cls, placeholder, field) {
      if (!onEdit && !image[field]) {
        return;
      }
      var n = el("div", cls, image[field] || "");
      if (onEdit) {
        n.contentEditable = "true";
        n.setAttribute("data-placeholder", placeholder);
        n.addEventListener("click", function (event) { event.stopPropagation(); });
        n.addEventListener("keydown", function (event) {
          event.stopPropagation();
          if (event.key === "Enter") {
            event.preventDefault();
            n.blur();
          }
          if (event.key === "Escape") {
            n.blur();
            close();
          }
        });
        n.addEventListener("paste", function (event) { plainPaste(event, true); });
        n.addEventListener("blur", function () { onEdit(field, n.textContent.trim()); });
      }
      overlay.appendChild(n);
    }
    line("lightbox-name", "Add an image name", "name");
    line("lightbox-caption", "Add a descriptor", "caption");

    function close() {
      if (document.activeElement && overlay.contains(document.activeElement)) {
        document.activeElement.blur();
      }
      overlay.remove();
      document.removeEventListener("keydown", onKey);
    }
    function onKey(event) {
      if (event.key === "Escape") {
        close();
      }
    }
    overlay.addEventListener("click", close);
    document.addEventListener("keydown", onKey);
    document.body.appendChild(overlay);
  }

  /* ---- Read view ----------------------------------------------------- */

  function setExpanded(button, body, isOpen) {
    button.setAttribute("aria-expanded", isOpen ? "true" : "false");
    body.hidden = !isOpen;
    if (button.parentNode.classList.contains("item-row")) {
      button.parentNode.classList.toggle("is-open", isOpen);
    }
  }

  function openItem(itemId) {
    var head = app.querySelector('[data-item="' + itemId + '"] .item-head');
    if (head && head.getAttribute("aria-expanded") !== "true") {
      open.items[itemId] = true;
      setExpanded(head, document.getElementById(head.getAttribute("aria-controls")), true);
    }
  }

  app.addEventListener("click", function (event) {
    if (editing) {
      return;
    }
    var secHead = event.target.closest(".sec-head");
    if (secHead) {
      var sid = secHead.closest(".group").getAttribute("data-sec");
      open.sections[sid] = secHead.getAttribute("aria-expanded") !== "true";
      setExpanded(secHead, document.getElementById(secHead.getAttribute("aria-controls")), open.sections[sid]);
      return;
    }
    var imageIcon = event.target.closest(".image-icon");
    if (imageIcon) {
      addImages(imageIcon.getAttribute("data-image-item"));
      return;
    }
    var thumb = event.target.closest(".thumb-open");
    if (thumb) {
      openImageView(thumb.getAttribute("data-image-id"));
      return;
    }
    var caret = event.target.closest(".item-caret");
    var itemHead = caret ? caret.parentNode.querySelector(".item-head") : event.target.closest(".item-head");
    if (itemHead && itemHead.tagName === "BUTTON") {
      var iid = itemHead.closest("li").getAttribute("data-item");
      var nowOpen = itemHead.getAttribute("aria-expanded") !== "true";
      if (nowOpen) {
        open.items[iid] = true;
      } else {
        delete open.items[iid];
      }
      setExpanded(itemHead, document.getElementById(itemHead.getAttribute("aria-controls")), nowOpen);
      return;
    }
    var pill = event.target.closest(".attachment-pill");
    if (pill) {
      var image = data.sections[+pill.dataset.gi].items[+pill.dataset.ii].images[+pill.dataset.img];
      if (image) {
        openLightbox(image, null);
      }
      return;
    }
    var confirmBtn = event.target.closest(".confirm-btn");
    if (confirmBtn) {
      setAnswer(confirmBtn.parentNode.getAttribute("data-confirm"), confirmBtn.getAttribute("data-answer"));
      return;
    }
    var noteIcon = event.target.closest(".note-icon");
    if (noteIcon) {
      var nk = noteIcon.getAttribute("data-note-key");
      refOpen[nk] = !refOpen[nk];
      refreshPoint(nk);
      if (refOpen[nk]) {
        var box = document.getElementById("pn-" + nk);
        if (box) {
          box.focus();
        }
      }
    }
  });

  app.addEventListener("input", function (event) {
    if (editing || !event.target.classList.contains("point-notes-input")) {
      return;
    }
    notesInput(event.target.closest(".point-notes").getAttribute("data-notes"), event.target);
  });

  /* ---- Shared store -------------------------------------------------- */

  var since = 0;
  var pulling = false;
  var myName = readLocal(NAME_KEY, "") || "";   // never asked for; set in browsers that unlock edit mode

  function setStoreStatus(text) {
    var s = document.getElementById("notesStatus");
    if (s) {
      s.textContent = text;
    }
  }

  function storeCall(body) {
    return fetch(STORE_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json();
    }).then(function (res) {
      if (!res || !res.ok) {
        throw new Error((res && res.error) || "The store did not answer");
      }
      return res;
    });
  }

  function pullStore() {
    if (!STORE_URL || pulling) {
      return;
    }
    pulling = true;
    fetch(STORE_URL + "?action=pull&since=" + since).then(function (res) {
      return res.json();
    }).then(function (res) {
      if (!res || !res.ok) {
        throw new Error("pull failed");
      }
      since = res.now || since;
      var touchedImages = {};
      (res.records || []).forEach(function (rec) {
        var p = rec.payload || {};
        if (p.meeting !== MEETING) {
          return;
        }
        if (rec.kind === IMAGE_KIND) {
          if (rec.deleted) {
            delete images[rec.id];
          } else if (viewing !== rec.id) {
            images[rec.id] = Object.assign({id: rec.id}, p);
          }
          touchedImages[p.item] = true;
          return;
        }
        if (rec.kind !== CONFIRM_KIND) {
          return;
        }
        // Never replace notes someone is typing here with an older copy from the store.
        var box = document.getElementById("pn-" + rec.id);
        if (notesPending[rec.id] || (box && box === document.activeElement)) {
          p.notes = box ? box.value : (confirms[rec.id] || {}).notes;
        }
        confirms[rec.id] = p;
        refreshPoint(rec.id);
      });
      Object.keys(touchedImages).forEach(renderImages);
      setStoreStatus("");
    }).catch(function () {
      setStoreStatus("Answers could not load. Retrying.");
    }).then(function () {
      pulling = false;
    });
  }

  function formatTime(ms) {
    var d = new Date(ms);
    var time = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
    if (d.toDateString() === new Date().toDateString()) {
      return time;
    }
    return d.toLocaleDateString([], {month: "short", day: "numeric"}) + ", " + time;
  }

  /* ---- Confirm: Yes / Add Notes --------------------------------------- */

  var points = {};           // answer key -> the point's text and where it sits
  var confirms = {};         // answer key -> latest record: answer, notes, and every change in history
  var notesTimers = {};
  var notesPending = {};     // answer key -> notes typed here but not saved yet
  var refOpen = {};          // reference point key -> its Notes box is open in this view

  function hasNotes(key) {
    return !!(confirms[key] && (confirms[key].notes || "").trim());
  }

  // "yes", "no" or null. Records from the earlier single Confirmed button count as yes.
  function answerOf(c) {
    if (!c) {
      return null;
    }
    if (c.answer !== undefined) {
      return c.answer;
    }
    return c.confirmed ? "yes" : null;
  }

  function answerTitle(c, answer) {
    return (answer === "yes" ? "Confirmed" : "Notes added") + (c.by ? " by " + c.by : "") + ", " + formatTime(c.at) + ". Click again to clear.";
  }

  function confirmButtons(key) {
    var c = confirms[key];
    var answer = answerOf(c);
    function button(value, label) {
      var on = answer === value;
      return '<button type="button" class="confirm-btn is-' + value + (on ? " is-on" : "") + '" data-answer="' + value + '"' +
        ' aria-pressed="' + on + '"' + (on ? ' title="' + esc(answerTitle(c, value)) + '"' : "") + ">" + label + "</button>";
    }
    return button("yes", "Confirm: Yes") + button("no", "Add Notes");
  }

  function refreshPoint(key) {
    var pair = app.querySelector('[data-confirm="' + key + '"]');
    if (pair) {
      pair.innerHTML = confirmButtons(key);
    }
    var icon = app.querySelector('[data-note-key="' + key + '"]');
    if (icon) {
      // Notes someone else adds open the box here too.
      if (hasNotes(key)) {
        refOpen[key] = refOpen[key] || !icon.classList.contains("has-notes");
      }
      icon.classList.toggle("has-notes", hasNotes(key));
      icon.setAttribute("aria-expanded", refOpen[key] ? "true" : "false");
    }
    var wrap = app.querySelector('[data-notes="' + key + '"]');
    if (wrap) {
      wrap.hidden = icon ? !refOpen[key] : answerOf(confirms[key]) !== "no";
      var box = document.getElementById("pn-" + key);
      if (box && box !== document.activeElement && !notesPending[key]) {
        box.value = (confirms[key] && confirms[key].notes) || "";
      }
    }
  }

  function setNotesStatus(key, text, isError) {
    var status = app.querySelector('[data-notes-status="' + key + '"]');
    if (status) {
      status.textContent = text;
      status.setAttribute("data-state", isError ? "error" : "");
    }
  }

  function putAnswer(key, record) {
    return storeCall({action: "put", kind: CONFIRM_KIND, id: key, actor: myName, payload: record});
  }

  // Clicking Yes or No sets that answer; clicking the highlighted one again clears it.
  // Notes are kept either way, and history records every change.
  function setAnswer(key, value) {
    var point = points[key];
    if (!point || !STORE_URL) {
      return;
    }
    var prev = confirms[key];
    var answer = answerOf(prev) === value ? null : value;
    var at = Date.now();
    var box = document.getElementById("pn-" + key);
    var history = prev && prev.history ? prev.history.slice() : [];
    history.push({answer: answer, by: myName, at: at});
    var next = {
      meeting: MEETING, item: point.item, itemTitle: point.itemTitle, section: point.section, text: point.text,
      answer: answer, notes: box ? box.value : ((prev && prev.notes) || ""), by: myName, at: at, history: history
    };
    confirms[key] = next;
    notesPending[key] = false;
    clearTimeout(notesTimers[key]);
    refreshPoint(key);
    if (answer === "no" && box) {
      box.focus();
    }
    putAnswer(key, next).catch(function () {
      if (prev) {
        confirms[key] = prev;
      } else {
        delete confirms[key];
      }
      refreshPoint(key);
      flash("Not saved. Check your connection, then try again.");
    });
  }

  // Notes save on their own a moment after typing stops.
  function notesInput(key, box) {
    notesPending[key] = true;
    setNotesStatus(key, "");
    clearTimeout(notesTimers[key]);
    notesTimers[key] = setTimeout(function () { saveNotes(key, box); }, 900);
  }

  function saveNotes(key, box) {
    var point = points[key];
    var c = confirms[key] || (point && {
      meeting: MEETING, item: point.item, itemTitle: point.itemTitle, section: point.section, text: point.text,
      answer: null, notes: "", by: myName, at: Date.now(), history: []
    });
    if (!c) {
      return;
    }
    var text = box.value;
    var next = Object.assign({}, c, {notes: text, notesAt: Date.now()});
    confirms[key] = next;
    setNotesStatus(key, "Saving");
    putAnswer(key, next).then(function () {
      if (box.value === text) {
        notesPending[key] = false;
        setNotesStatus(key, "Saved");
      }
    }).catch(function () {
      setNotesStatus(key, "Not saved. Check your connection, then type again to retry.", true);
    });
  }

  window.addEventListener("beforeunload", function (event) {
    var unsaved = Object.keys(notesPending).some(function (k) { return notesPending[k]; });
    if (unsaved) {
      event.preventDefault();
      event.returnValue = "";
    }
  });

  /* ---- Images on items ---------------------------------------------- */
  // Anyone can add images to an item from the image icon on its row. Files go to the
  // project store's Google Drive folder; each image is one "meetimage" record holding
  // its Drive id, title and description. Removing one takes it off the page and out of
  // the record; the file itself stays in the Drive folder.

  var images = {};           // image id -> record
  var imagePreviews = {};    // image id -> local copy, shown until Drive serves the file
  var viewing = null;        // id of the image open full size

  function imagesFor(itemId) {
    return Object.keys(images).map(function (k) { return images[k]; })
      .filter(function (r) { return r.item === itemId; })
      .sort(function (a, b) { return a.at - b.at; });
  }

  function imageUrl(rec, size) {
    return imagePreviews[rec.id] || "https://drive.google.com/thumbnail?id=" + encodeURIComponent(rec.driveId || "") + "&sz=" + size;
  }

  // Drive sometimes refuses its thumbnail link for a fresh file; this address serves the same image.
  document.addEventListener("error", function (event) {
    var img = event.target;
    if (img.tagName === "IMG" && img.getAttribute("data-drive") && !img.getAttribute("data-fallback")) {
      img.setAttribute("data-fallback", "1");
      img.src = "https://lh3.googleusercontent.com/d/" + encodeURIComponent(img.getAttribute("data-drive"));
    }
  }, true);

  function imagesMarkup(itemId) {
    return imagesFor(itemId).map(function (rec) {
      return '<figure class="thumb-card' + (rec.pending ? " is-uploading" : "") + '">' +
        '<button type="button" class="thumb-open" data-image-id="' + esc(rec.id) + '" title="View full size">' +
          '<img src="' + esc(imageUrl(rec, "w400")) + '" data-drive="' + esc(rec.driveId || "") + '" alt="' + esc(rec.title || "") + '" loading="lazy">' +
        "</button>" +
        "<figcaption>" + esc(rec.pending ? "Uploading…" : rec.title || "") + "</figcaption>" +
      "</figure>";
    }).join("");
  }

  function renderImages(itemId) {
    var box = app.querySelector('[data-images="' + itemId + '"]');
    if (box) {
      box.innerHTML = imagesMarkup(itemId);
    }
    var icon = app.querySelector('[data-image-item="' + itemId + '"]');
    if (icon) {
      icon.classList.toggle("has-images", imagesFor(itemId).length > 0);
    }
  }

  function itemContext(itemId) {
    for (var g = 0; g < data.sections.length; g++) {
      for (var i = 0; i < data.sections[g].items.length; i++) {
        if (data.sections[g].items[i].id === itemId) {
          return {itemTitle: data.sections[g].items[i].text, section: data.sections[g].title};
        }
      }
    }
    return {itemTitle: "", section: ""};
  }

  function putImage(rec) {
    return storeCall({action: "put", kind: IMAGE_KIND, id: rec.id, actor: myName, payload: {
      meeting: MEETING, item: rec.item, itemTitle: rec.itemTitle, section: rec.section,
      driveId: rec.driveId, title: rec.title || "", description: rec.description || "", at: rec.at
    }});
  }

  function addImages(itemId) {
    var picker = el("input");
    picker.type = "file";
    picker.accept = "image/*";
    picker.multiple = true;
    picker.addEventListener("change", function () {
      var files = Array.prototype.slice.call(picker.files || []);
      if (!files.length) {
        return;
      }
      openItem(itemId);
      var shown = false;
      files.reduce(function (chain, file) {
        return chain.then(function () {
          return uploadImage(itemId, file).then(function (rec) {
            // The first new image opens full size, ready for its title and description.
            if (!shown) {
              shown = true;
              openImageView(rec.id);
            }
          });
        });
      }, Promise.resolve()).catch(function (error) {
        flash(error.message || "Image upload failed");
      });
    });
    picker.click();
  }

  function uploadImage(itemId, file) {
    var ctx = itemContext(itemId);
    return shrink(file).then(function (dataUrl) {
      var rec = {
        id: uid("img"), item: itemId, itemTitle: ctx.itemTitle, section: ctx.section,
        title: file.name.replace(/\.[^.]+$/, ""), description: "", at: Date.now(), pending: true
      };
      images[rec.id] = rec;
      imagePreviews[rec.id] = dataUrl;
      renderImages(itemId);
      return storeCall({
        action: "upload", dataBase64: dataUrl.split(",")[1], mime: "image/jpeg",
        name: "meet-" + MEETING + "-" + rec.id + ".jpg"
      }).then(function (res) {
        rec.driveId = res.driveId;
        return putImage(rec);
      }).then(function () {
        delete rec.pending;
        renderImages(itemId);
        return rec;
      }).catch(function () {
        delete images[rec.id];
        renderImages(itemId);
        throw new Error("Image upload failed. Check your connection, then try again.");
      });
    });
  }

  function openImageView(id) {
    var rec = images[id];
    if (!rec) {
      return;
    }
    viewing = id;
    var overlay = el("div", "lightbox image-view");
    var img = el("img");
    img.src = imageUrl(rec, "w2000");
    img.setAttribute("data-drive", rec.driveId || "");
    img.alt = rec.title || "";
    overlay.appendChild(img);

    var panel = el("div", "image-view-fields");
    panel.addEventListener("click", function (event) { event.stopPropagation(); });
    var titleLabel = el("label", null, "Title");
    titleLabel.setAttribute("for", "iv-title");
    var title = el("input");
    title.type = "text";
    title.id = "iv-title";
    title.value = rec.title || "";
    title.autocomplete = "off";
    var descLabel = el("label", null, "Description");
    descLabel.setAttribute("for", "iv-desc");
    var desc = el("textarea");
    desc.id = "iv-desc";
    desc.value = rec.description || "";
    var row = el("div", "image-view-row");
    var status = el("span", "image-view-status");
    status.setAttribute("aria-live", "polite");
    var actions = el("div", "image-view-actions");
    var removeBtn = el("button", "ghost small", "Remove image");
    removeBtn.type = "button";
    var closeBtn = el("button", "ghost small", "Done");
    closeBtn.type = "button";
    actions.appendChild(removeBtn);
    actions.appendChild(closeBtn);
    row.appendChild(status);
    row.appendChild(actions);
    [titleLabel, title, descLabel, desc, row].forEach(function (n) { panel.appendChild(n); });
    overlay.appendChild(panel);

    var timer = null;
    var dirty = false;
    function setStatus(text, isError) {
      status.textContent = text;
      status.setAttribute("data-state", isError ? "error" : "");
    }
    function saveLabels() {
      clearTimeout(timer);
      if (!dirty || !images[id]) {
        return;
      }
      rec.title = title.value.trim();
      rec.description = desc.value.trim();
      renderImages(rec.item);
      if (rec.pending) {
        return;   // the upload saves these values when it finishes
      }
      dirty = false;
      setStatus("Saving");
      putImage(rec).then(function () {
        setStatus("Saved");
      }).catch(function () {
        dirty = true;
        setStatus("Not saved. Check your connection, then type again to retry.", true);
      });
    }
    function onType() {
      dirty = true;
      setStatus("");
      clearTimeout(timer);
      timer = setTimeout(saveLabels, 800);
    }
    title.addEventListener("input", onType);
    desc.addEventListener("input", onType);
    title.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        desc.focus();
      }
    });

    var armed = null;
    removeBtn.addEventListener("click", function () {
      if (!armed) {
        removeBtn.textContent = "Remove? Click again";
        removeBtn.classList.add("is-warning");
        armed = setTimeout(function () {
          armed = null;
          removeBtn.textContent = "Remove image";
          removeBtn.classList.remove("is-warning");
        }, 4000);
        return;
      }
      clearTimeout(armed);
      dirty = false;
      delete images[id];
      close();
      renderImages(rec.item);
      storeCall({action: "del", kind: IMAGE_KIND, id: id, actor: myName, payload: {meeting: MEETING, item: rec.item}})
        .catch(function () {
          images[id] = rec;
          renderImages(rec.item);
          flash("The image was not removed. Check your connection, then try again.");
        });
    });

    function close() {
      saveLabels();
      viewing = null;
      overlay.remove();
      document.removeEventListener("keydown", onKey);
    }
    function onKey(event) {
      if (event.key === "Escape") {
        close();
      }
    }
    closeBtn.addEventListener("click", close);
    overlay.addEventListener("click", close);
    document.addEventListener("keydown", onKey);
    document.body.appendChild(overlay);
    title.focus();
    title.select();
  }

  /* ---- Edit view ----------------------------------------------------- */

  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () {
        reject(new Error("Could not read that file"));
      };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () {
          reject(new Error("That file is not an image"));
        };
        img.onload = function () {
          var scale = Math.min(1, MAX_EDGE / img.width, 8000 / img.height);
          var canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = "#030811";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.86));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function uploadImages(item) {
    var picker = el("input");
    picker.type = "file";
    picker.accept = "image/*";
    picker.multiple = true;
    picker.addEventListener("change", function () {
      var files = Array.prototype.slice.call(picker.files || []);
      if (!files.length) {
        return;
      }
      flash(files.length > 1 ? "Uploading images" : "Uploading image");
      files.reduce(function (chain, file, k) {
        return chain.then(function () {
          return shrink(file).then(function (dataUrl) {
            var path = IMAGE_DIR + Date.now().toString(36) + "-" + k + ".jpg";
            return putFile(path, dataUrl.split(",")[1], "Add image to the Oct 5 agenda").then(function () {
              previews[path] = dataUrl;
              snapshot();
              item.images.push({src: path, name: file.name.replace(/\.[^.]+$/, ""), caption: ""});
              render();
              save();
            });
          });
        });
      }, Promise.resolve()).catch(function (error) {
        flash(error.message || "Image upload failed");
      });
    });
    picker.click();
  }

  function focusItem(gi, ii) {
    var sec = app.querySelectorAll("#agenda > .group")[gi];
    if (!sec) {
      return;
    }
    var items = sec.querySelectorAll(".item");
    focusEnd(items[Math.min(ii, items.length - 1)]);
  }

  function move(list, from, to) {
    if (to < 0 || to >= list.length) {
      return;
    }
    snapshot();
    list.splice(to, 0, list.splice(from, 1)[0]);
    render();
    save();
  }

  function remove(list, index) {
    snapshot();
    list.splice(index, 1);
    render();
    save();
  }

  function rowEditor(gi, ii) {
    var items = data.sections[gi].items;
    var item = items[ii];
    var li = el("li");
    var main = el("div", "row-main");

    var span = el("span", "item", item.text);
    editableLine(span, "Item title", "Item title", function (t) { item.text = t; }, function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        snapshot();
        items.splice(ii + 1, 0, normalizeItem({}));
        render();
        save();
        focusItem(gi, ii + 1);
        return true;
      }
      if (event.key === "Backspace" && !span.textContent.trim() && items.length > 1 && isBlank(item)) {
        event.preventDefault();
        remove(items, ii);
        focusItem(gi, Math.max(0, ii - 1));
        return true;
      }
    });
    main.appendChild(span);

    var note = el("p", "item-note", item.note);
    editableLine(note, "Add a short note (optional)", "Item note", function (t) { item.note = t; });
    main.appendChild(note);

    var details = el("div", "item-details");
    details.innerHTML = item.details ? editLinesMarkup(item.details) : "";
    details.contentEditable = "true";
    details.setAttribute("role", "textbox");
    details.setAttribute("aria-multiline", "true");
    details.setAttribute("aria-label", "Item details");
    details.setAttribute("data-placeholder", "Add details (optional). Start a line with - for a bullet.");
    details.addEventListener("input", function () {
      item.details = details.innerText.replace(/\n{2,}/g, "\n").trim();
      save();
    });
    details.addEventListener("focus", function () {
      // Start empty details with a line block so the first paragraph is spaced like the rest.
      if (details.innerText.trim()) {
        return;
      }
      details.innerHTML = "<div><br></div>";
      var range = document.createRange();
      range.setStart(details.firstChild, 0);
      range.collapse(true);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
    details.addEventListener("blur", function () {
      if (!details.innerText.trim()) {
        details.innerHTML = "";
      }
    });
    details.addEventListener("paste", function (event) { plainPaste(event, false); });
    details.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        details.blur();
      }
    });
    main.appendChild(details);

    var attach = el("div", "attach");
    item.links.forEach(function (href, k) {
      var chip = el("span", "chip");
      var a = el("a", "item-link", linkLabel(href) + " ↗");
      a.href = safeHref(href);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.title = href;
      var x = el("button", "chip-x");
      x.type = "button";
      x.innerHTML = ICONS.close;
      x.title = "Remove this link";
      x.setAttribute("aria-label", "Remove this link");
      x.addEventListener("click", function () { remove(item.links, k); });
      chip.appendChild(a);
      chip.appendChild(x);
      attach.appendChild(chip);
    });
    item.images.forEach(function (image, k) {
      var box = el("span", "thumb");
      var pill = el("button", "attachment-pill", image.name || "Image");
      pill.type = "button";
      pill.title = "View full size and edit the name";
      pill.addEventListener("click", function () {
        openLightbox(image, function (field, text) {
          if (image[field] === text) {
            return;
          }
          image[field] = text;
          pill.textContent = image.name || "Image";
          save();
        });
      });
      var x = el("button", "chip-x");
      x.type = "button";
      x.innerHTML = ICONS.close;
      x.title = "Remove this image";
      x.setAttribute("aria-label", "Remove this image");
      x.addEventListener("click", function () { remove(item.images, k); });
      box.appendChild(pill);
      box.appendChild(x);
      attach.appendChild(box);
    });
    main.appendChild(attach);

    var tools = el("div", "attach-tools");
    var linkField = textField("link-new-" + item.id, "", "Paste a link and press Enter", "Add a link to this item");
    linkField.addEventListener("keydown", function (event) {
      if (event.key !== "Enter") {
        return;
      }
      event.preventDefault();
      var v = normUrl(linkField.value);
      if (!v) {
        return;
      }
      snapshot();
      item.links.push(v);
      render();
      save();
      focusEnd(document.getElementById(linkField.id));
    });
    tools.appendChild(linkField);
    tools.appendChild(addBtn("Add images", function () { uploadImages(item); }, null, "image"));
    main.appendChild(tools);
    li.appendChild(main);

    var actions = el("div", "row-actions");
    var up = iconBtn("up", "Move item up");
    up.disabled = ii === 0;
    up.addEventListener("click", function () { move(items, ii, ii - 1); });
    var down = iconBtn("down", "Move item down");
    down.disabled = ii === items.length - 1;
    down.addEventListener("click", function () { move(items, ii, ii + 1); });
    var del = iconBtn("trash", "Delete item", "is-delete");
    del.addEventListener("click", function () { remove(items, ii); });
    actions.appendChild(up);
    actions.appendChild(down);
    actions.appendChild(del);
    li.appendChild(actions);
    return li;
  }

  function sectionEditor(gi) {
    var sections = data.sections;
    var sec = sections[gi];
    var section = el("section", "group");
    var h = el("h2", "edit-sec-head");
    var title = el("span", "sec-title", sec.title);
    editableLine(title, "Section title", "Section title", function (t) { sec.title = t; });
    h.appendChild(title);

    var actions = el("span", "sec-actions");
    var up = iconBtn("up", "Move section up");
    up.disabled = gi === 0;
    up.addEventListener("click", function () { move(sections, gi, gi - 1); });
    var down = iconBtn("down", "Move section down");
    down.disabled = gi === sections.length - 1;
    down.addEventListener("click", function () { move(sections, gi, gi + 1); });
    var del = iconBtn("trash", "Delete section", "is-delete");
    del.addEventListener("click", function () { remove(sections, gi); });
    actions.appendChild(up);
    actions.appendChild(down);
    actions.appendChild(del);
    h.appendChild(actions);
    section.appendChild(h);

    var ol = el("ol", "rows");
    sec.items.forEach(function (_, ii) { ol.appendChild(rowEditor(gi, ii)); });
    section.appendChild(ol);
    section.appendChild(addBtn("Add item", function () {
      snapshot();
      sec.items.push(normalizeItem({}));
      render();
      save();
      focusItem(gi, sec.items.length - 1);
    }));
    return section;
  }

  function renderEdit() {
    app.innerHTML = "";
    var bar = el("div", "files-bar is-editing");
    data.links.forEach(function (l, i) {
      var row = el("div", "link-edit");
      var label = textField("link-label-" + i, l.label, "Button label", "Button label");
      label.addEventListener("input", function () {
        l.label = label.value.trim();
        save();
      });
      var url = textField("link-url-" + i, l.href, "https://…", "Button link", "field-url");
      url.addEventListener("input", function () {
        l.href = url.value.trim();
        save();
      });
      url.addEventListener("blur", function () {
        var next = normUrl(url.value);
        if (next !== l.href) {
          l.href = next;
          save();
        }
        url.value = next;
      });
      var x = iconBtn("close", "Remove this button", "is-delete");
      x.addEventListener("click", function () { remove(data.links, i); });
      row.appendChild(label);
      row.appendChild(url);
      row.appendChild(x);
      bar.appendChild(row);
    });
    bar.appendChild(addBtn("Add button", function () {
      snapshot();
      data.links.push({label: "", href: ""});
      render();
      focusEnd(document.getElementById("link-label-" + (data.links.length - 1)));
    }));
    app.appendChild(bar);

    var header = el("header");
    var h1 = el("h1", null, data.title);
    editableLine(h1, "Meeting title", "Meeting title", function (t) { data.title = t; });
    var h6 = el("h6", null, data.date);
    editableLine(h6, "Meeting date", "Meeting date", function (t) { data.date = t; });
    header.appendChild(h1);
    header.appendChild(h6);
    app.appendChild(header);

    var main = el("main");
    main.id = "agenda";
    data.sections.forEach(function (_, gi) { main.appendChild(sectionEditor(gi)); });
    app.appendChild(main);
    app.appendChild(addBtn("Add section", function () {
      snapshot();
      data.sections.push({id: uid("s"), title: "", items: [normalizeItem({})]});
      render();
      save();
      var titles = app.querySelectorAll(".sec-title");
      focusEnd(titles[titles.length - 1]);
    }, "add-section"));
  }

  function render() {
    if (editing) {
      renderEdit();
      return;
    }
    points = {};
    app.innerHTML = readMarkup(data);
  }

  /* ---- GitHub saving ------------------------------------------------- */

  var token = "";
  var fileSha = "";
  var fileText = "";
  var saveTimer = null;
  var saving = false;
  var pending = false;
  var retried = false;
  var dirty = false;
  var lastError = null;
  var waiters = [];
  var statusEl = null;
  var barEl = null;
  var undoBtn = null;

  function readToken() {
    try {
      return localStorage.getItem(TOKEN_KEY) || "";
    } catch (e) {
      return "";
    }
  }

  function storeToken(value) {
    try {
      if (value) {
        localStorage.setItem(TOKEN_KEY, value);
      } else {
        localStorage.removeItem(TOKEN_KEY);
      }
    } catch (e) {}
  }

  function api(path, options) {
    options = options || {};
    options.headers = {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + token
    };
    if (options.body) {
      options.headers["Content-Type"] = "application/json";
    }
    return fetch("https://api.github.com/repos/" + REPO + path, options).then(function (res) {
      return res.json().catch(function () {
        return {};
      }).then(function (body) {
        if (!res.ok) {
          var error = new Error(body.message || ("GitHub error " + res.status));
          error.status = res.status;
          throw error;
        }
        return body;
      });
    });
  }

  function toBase64(text) {
    var bytes = new TextEncoder().encode(text);
    var binary = "";
    for (var i = 0; i < bytes.length; i += 0x8000) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(binary);
  }

  function fromBase64(b64) {
    var binary = atob(b64.replace(/\s/g, ""));
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return new TextDecoder().decode(bytes);
  }

  function putFile(path, base64, message, sha) {
    var body = {message: message, content: base64, branch: BRANCH};
    if (sha) {
      body.sha = sha;
    }
    return api("/contents/" + path, {method: "PUT", body: JSON.stringify(body)});
  }

  var DATA_BLOCK = new RegExp('(<script type="application/json" id="page-' + 'data">)([\\s\\S]*?)(</' + 'script>)');

  function pullLatest() {
    return api("/contents/" + FILE + "?ref=" + BRANCH).then(function (body) {
      fileSha = body.sha;
      fileText = fromBase64(body.content);
      var match = fileText.match(DATA_BLOCK);
      if (!match) {
        throw new Error("Could not find the content block in the saved file");
      }
      return normalizeDoc(JSON.parse(match[2]));
    });
  }

  // Each change saves on its own after a short pause, so typing makes one commit, not one per key.
  function save() {
    if (!editing) {
      return;
    }
    dirty = true;
    setStatus("Unsaved changes");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 1200);
  }

  function flush() {
    if (saving) {
      pending = true;
      return;
    }
    clearTimeout(saveTimer);
    saving = true;
    pending = false;
    dirty = false;
    setStatus("Saving");
    var json = "\n" + JSON.stringify(data, null, 2).replace(/</g, "\\u003c") + "\n";
    var next = fileText.replace(DATA_BLOCK, function (all, open, body, close) {
      return open + json + close;
    });

    putFile(FILE, toBase64(next), "Update meeting page content", fileSha).then(function (body) {
      fileSha = body.content.sha;
      fileText = next;
      retried = false;
      lastError = null;
      setStatus("Saved. Live in about a minute");
      flash("Saved");
    }).catch(function (error) {
      if ((error.status === 409 || error.status === 422) && !retried) {
        retried = true;
        // The file changed on GitHub since it was loaded. Take its latest
        // version as the base and write this page's content over it.
        return pullLatest().then(function () {
          pending = true;
        });
      }
      lastError = error;
      dirty = true;
      setStatus("Not saved. " + explain(error), true);
      flash("Not saved");
    }).then(function () {
      saving = false;
      if (pending) {
        flush();
        return;
      }
      var done = waiters;
      waiters = [];
      done.forEach(function (resolve) {
        resolve();
      });
    });
  }

  function explain(error) {
    if (error.status === 401) {
      return "GitHub rejected the token. Lock, then unlock with a new one.";
    }
    if (error.status === 403 || error.status === 404) {
      return "This token can open the repo but not save to it. It needs Contents set to Read and write for the SIG repo.";
    }
    return error.message || "Check your connection and try again.";
  }

  // Finish any edit in progress and resolve once nothing is left to save.
  function whenSaved() {
    if (document.activeElement && document.activeElement.isContentEditable) {
      document.activeElement.blur();
    }
    if (saving || pending) {
      return new Promise(function (resolve) {
        waiters.push(resolve);
      });
    }
    if (dirty) {
      return new Promise(function (resolve) {
        waiters.push(resolve);
        flush();
      });
    }
    return Promise.resolve();
  }

  function setStatus(text, isError) {
    if (statusEl) {
      statusEl.textContent = text;
      barEl.classList.toggle("is-error", !!isError);
    }
  }

  function updateUndo() {
    if (undoBtn) {
      undoBtn.disabled = !undoStack.length;
    }
  }

  window.addEventListener("beforeunload", function (event) {
    if (editing && (dirty || saving || pending)) {
      event.preventDefault();
      event.returnValue = "";
    }
  });

  function showEditBar() {
    var bar = el("div", "edit-bar");
    barEl = bar;
    statusEl = el("span", "status", "Editing. Changes save to GitHub");

    undoBtn = el("button", "ghost quiet", "Undo");
    undoBtn.type = "button";
    undoBtn.title = "Undo the last add, delete or move";
    undoBtn.addEventListener("click", function () {
      if (!undoStack.length) {
        return;
      }
      data = normalizeDoc(JSON.parse(undoStack.pop()));
      updateUndo();
      render();
      save();
    });
    updateUndo();

    var done = el("button", "ghost", "Lock");
    done.type = "button";
    // Lock waits for every save to land, then shows the page the way the client sees it.
    done.addEventListener("mousedown", function (event) {
      event.preventDefault();
    });
    done.addEventListener("click", function () {
      done.disabled = true;
      setStatus("Saving before locking");
      whenSaved().then(function () {
        if (lastError) {
          done.disabled = false;
          setStatus("Not saved, so the page is still unlocked. " + explain(lastError), true);
          return;
        }
        storeToken("");
        token = "";
        editing = false;
        document.body.classList.remove("editing");
        bar.remove();
        statusEl = null;
        undoBtn = null;
        history.replaceState(null, "", window.location.pathname);
        render();
        flash("Locked. Edits are live in a few minutes");
      });
    });
    bar.appendChild(statusEl);
    bar.appendChild(undoBtn);
    bar.appendChild(done);
    document.body.appendChild(bar);
  }

  function showUnlock(message) {
    var slot = document.getElementById("unlock-slot");
    slot.textContent = "";
    var form = el("form", "unlock");
    form.appendChild(el("p", null, message || "Paste your GitHub token to edit this page. It stays in this browser only."));
    var input = el("input");
    input.type = "password";
    input.placeholder = "GitHub token";
    input.autocomplete = "off";
    input.setAttribute("aria-label", "GitHub token");
    var go = el("button", "ghost", "Unlock");
    go.type = "submit";
    form.appendChild(input);
    form.appendChild(go);
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      unlock(input.value.trim());
    });
    slot.appendChild(form);
    input.focus();
  }

  function unlock(value) {
    if (!value) {
      return;
    }
    token = value;
    api("").then(function (repo) {
      if (!repo.permissions || !repo.permissions.push) {
        throw new Error("That token cannot write to the SIG repo.");
      }
      return pullLatest();
    }).then(function (latest) {
      storeToken(value);
      // Only the owner can unlock, so this browser signs its answers as Lindsay from now on.
      if (!myName) {
        myName = OWNER_NAME;
        writeLocal(NAME_KEY, myName);
      }
      data = latest;
      editing = true;
      document.body.classList.add("editing");
      document.getElementById("unlock-slot").textContent = "";
      showEditBar();
      render();
    }).catch(function (error) {
      token = "";
      storeToken("");
      showUnlock(error.message === "Bad credentials" ? "That token was not accepted. Try again." : error.message);
    });
  }

  render();

  if (STORE_URL) {
    pullStore();
    setInterval(function () {
      if (document.visibilityState === "visible") {
        pullStore();
      }
    }, POLL_MS);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        pullStore();
      }
    });
  }

  window.addEventListener("hashchange", function () {
    if (window.location.hash === "#edit" && !editing) {
      window.location.reload();
    }
  });

  if (window.location.hash === "#edit") {
    var saved = readToken();
    if (saved) {
      unlock(saved);
    } else {
      showUnlock();
    }
  }
})();
</script>
</body>
