<head>
<meta charset="utf-8">

<title>Signature Society · Website and Launch Party · Sept 17</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/hqq5dii.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
  :root{
    --navy-900:#030811; --navy-800:#08142B; --navy-700:#192D54;
    --tan-700:#6C5D3B; --tan-500:#A69263; --tan-400:#C3AD79; --tan-300:#E0C891;
    --neutral-50:#FFFEF9; --neutral-100:#F0EFE7; --neutral-300:#C8C5BA; --neutral-500:#9F9C8F;
    --btn-bg:#3F1214; --btn-text:#F6F5F4;

    --ff-display:"kepler-std-display",Georgia,"Times New Roman",serif;
    --ff-subhead:"kepler-std-subhead",Georgia,"Times New Roman",serif;
    --ff-text:"kepler-std",Georgia,"Times New Roman",serif;
    --ff-inter:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

    --ease-ui:160ms ease;
  }

  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    margin:0;
    background:var(--navy-900);
    color:var(--neutral-100);
    font-family:var(--ff-text);
    font-size:1.0625rem;
    line-height:1.5;
    letter-spacing:.005em;
  }

  .wrap{max-width:64rem;margin:0 auto;padding:2rem 1.25rem 5rem;}
  @media (min-width:700px){ .wrap{padding:3rem 2rem 6rem;} }
  @media (min-width:1000px){ .wrap{padding:3.5rem 3rem 7rem;} }

  /* Meeting Files button */
  .files-bar{display:flex;justify-content:flex-start;margin-bottom:3rem;}
  .btn{
    display:inline-block;
    background:var(--btn-bg);
    color:var(--btn-text);
    text-decoration:none;
    font-family:"kepler-std-medium-caption",Georgia,serif;
    font-weight:500;
    font-size:.9375rem;
    line-height:1;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:1.15rem 2.25rem;
    border:1px solid var(--btn-bg);
    transition:background var(--ease-ui),border-color var(--ease-ui),color var(--ease-ui);
  }
  .btn:hover{background:var(--tan-400);border-color:var(--tan-400);color:var(--navy-900);}
  .btn:focus-visible{outline:2px solid var(--tan-300);outline-offset:3px;}

  /* Header */
  header{margin-bottom:3.25rem;}
  h1{
    font-family:var(--ff-display);
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-size:2.556rem;
    line-height:1.26;
    color:var(--neutral-50);
    margin:0 0 1.25rem;
  }
  h1{white-space:pre-line;}
  @media (min-width:700px){ h1{font-size:3.75rem;line-height:1.22;} }
  @media (min-width:1000px){ h1{font-size:4.5625rem;line-height:1.2;} }

  .meta{
    font-family:var(--ff-inter);
    font-size:.9375rem;
    line-height:1.7;
    letter-spacing:.007em;
    color:var(--neutral-300);
    margin:0;
    max-width:56ch;
  }

  /* Groups */
  .group{margin-bottom:3.25rem;}
  .group h2{
    font-family:var(--ff-subhead);
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:1.419rem;
    line-height:1.45;
    color:var(--tan-300);
    margin:0 0 .75rem;
    display:flex;
    align-items:baseline;
    gap:1rem;
  }
  @media (min-width:700px){ .group h2{font-size:1.5rem;} }
  .group h2::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--tan-700);
  }

  ol{list-style:none;margin:0;padding:0;}
  li{border-bottom:1px solid var(--navy-700);}
  li:last-child{border-bottom:none;}

  /* Toggle */
  details summary{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:.5rem .875rem;
    cursor:pointer;
    position:relative;
    padding:1.125rem 2.75rem 1.125rem 0;
    font-family:var(--ff-text);
    font-size:1.0625rem;
    line-height:1.5;
    color:var(--neutral-100);
    transition:color var(--ease-ui);
    list-style:none;
  }
  @media (min-width:700px){ details summary{font-size:1.25rem;} }
  details summary::-webkit-details-marker{display:none;}
  details summary::marker{content:"";}
  details summary:hover{color:var(--tan-300);}
  details summary:focus-visible{outline:2px solid var(--tan-300);outline-offset:4px;}
  details summary::after{
    content:"";
    position:absolute;
    right:.5rem;
    top:50%;
    width:.5rem;
    height:.5rem;
    border-right:1.5px solid var(--tan-500);
    border-bottom:1.5px solid var(--tan-500);
    transform:translateY(-70%) rotate(45deg);
    transition:transform var(--ease-ui),border-color var(--ease-ui);
  }
  details[open] summary::after{transform:translateY(-30%) rotate(-135deg);}
  details summary:hover::after{border-color:var(--tan-300);}

  /* Always-open rows: no toggle */
  details.static summary{cursor:default;}
  details.static summary:hover{color:var(--neutral-100);}
  details.static summary::after{content:none;}

  details summary a{
    color:inherit;
    text-decoration:underline;
    text-decoration-color:var(--tan-500);
    text-underline-offset:.2em;
    transition:color var(--ease-ui),text-decoration-color var(--ease-ui);
  }
  details summary a:hover{color:var(--tan-300);text-decoration-color:var(--tan-300);}
  details summary a:focus-visible{outline:2px solid var(--tan-300);outline-offset:3px;}

  /* Image thumbnails */
  .thumbs{display:flex;flex-wrap:wrap;gap:.5rem;}
  .thumb{
    display:block;
    width:56px;height:56px;
    padding:0;
    background:var(--navy-800);
    border:1px solid var(--tan-700);
    cursor:zoom-in;
    transition:border-color var(--ease-ui);
  }
  .thumb img{display:block;width:100%;height:100%;object-fit:cover;}
  .thumb:hover{border-color:var(--tan-400);}
  .thumb:focus-visible{outline:2px solid var(--tan-300);outline-offset:2px;}

  /* Description */
  .note{
    display:block;
    margin:0 0 1.375rem;
    padding:.125rem 2.75rem .125rem .875rem;
    border-left:1px solid transparent;
    font-family:var(--ff-inter);
    font-size:.9375rem;
    line-height:1.7;
    letter-spacing:.007em;
    color:var(--neutral-500);
    max-width:66ch;
    white-space:pre-line;
    outline:none;
    transition:color var(--ease-ui),border-color var(--ease-ui);
  }

  /* Sub sections inside a description */
  .parts{margin:-.375rem 0 1.625rem;padding-left:.875rem;max-width:66ch;}
  .part{margin:0 0 1.125rem;}
  .part:last-child{margin-bottom:0;}
  .part-title{
    font-family:var(--ff-inter);
    font-weight:500;
    font-size:.875rem;
    line-height:1.6;
    letter-spacing:.02em;
    color:var(--tan-300);
    margin:0 0 .25rem;
    outline:none;
  }
  .part-line{
    font-family:var(--ff-inter);
    font-size:.9375rem;
    line-height:1.7;
    letter-spacing:.007em;
    color:var(--neutral-500);
    margin:0;
  }
  .part-label{
    font-size:.75rem;
    font-weight:500;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--neutral-300);
    margin-right:.5rem;
  }
  .part-text{outline:none;white-space:pre-line;}

  /* Full size image view */
  .lightbox{
    position:fixed;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.65rem;
    padding:3rem 1.5rem;
    background:rgba(3,8,17,.94);
    cursor:zoom-out;
  }
  .lightbox img{
    max-width:100%;min-height:0;flex:0 1 auto;
    object-fit:contain;
    border:1px solid var(--tan-700);
  }
  .lightbox-name,
  .lightbox-caption{
    flex:none;
    max-width:60ch;
    font-family:var(--ff-inter);
    text-align:center;
    outline:none;
    padding:.2rem .5rem;
    border-bottom:1px solid transparent;
    transition:border-color var(--ease-ui),color var(--ease-ui);
  }
  .lightbox-name{font-size:.875rem;line-height:1.5;letter-spacing:.02em;color:var(--tan-300);}
  .lightbox-caption{font-size:.75rem;line-height:1.7;letter-spacing:.09em;text-transform:uppercase;color:var(--neutral-300);}
  .lightbox-name:empty,.lightbox-caption:empty{display:none;}
  .lightbox-remove{
    flex:none;
    margin-top:.5rem;
    background:none;
    border:none;
    padding:.25rem;
    font-family:var(--ff-inter);
    font-size:.8125rem;
    color:var(--neutral-500);
    text-decoration:underline;
    cursor:pointer;
  }
  .lightbox-remove:hover{color:var(--tan-300);}

  /* ---- Edit mode (only after unlocking with a GitHub token) ---- */
  body.editing details summary{padding-right:8.5rem;}
  body.editing [contenteditable="true"]{cursor:text;}
  body.editing .note,
  body.editing .part-title,
  body.editing .part-text,
  body.editing .item-title,
  body.editing #page-title,
  body.editing #date-line{border-bottom:1px dashed transparent;}
  body.editing #page-title,body.editing #date-line{outline:none;caret-color:var(--tan-300);}
  body.editing #page-title:hover,body.editing #page-title:focus,
  body.editing #date-line:hover,body.editing #date-line:focus{border-bottom-color:var(--tan-700);}
  body.editing .note{border-left-color:var(--navy-700);}
  body.editing .note:hover,body.editing .note:focus{border-left-color:var(--tan-400);color:var(--neutral-300);}
  body.editing .item-title:hover,body.editing .item-title:focus,
  body.editing .part-title:hover,body.editing .part-title:focus,
  body.editing .part-text:hover,body.editing .part-text:focus{border-bottom-color:var(--tan-700);}
  body.editing .item-title{outline:none;caret-color:var(--tan-300);}
  body.editing .note:empty::before{content:"Add a description";color:var(--tan-700);}
  body.editing .lightbox-name:empty,
  body.editing .lightbox-caption:empty{display:block;border-bottom-color:var(--tan-700);}
  body.editing .lightbox-name:empty::before,
  body.editing .lightbox-caption:empty::before{content:attr(data-placeholder);color:var(--tan-500);}
  body.editing .lightbox-name,body.editing .lightbox-caption{cursor:text;}
  body.editing .lightbox-name:hover,body.editing .lightbox-name:focus,
  body.editing .lightbox-caption:hover,body.editing .lightbox-caption:focus{border-bottom-color:var(--tan-400);}

  .row-tools{
    position:absolute;
    right:1.75rem;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    gap:.125rem;
  }
  details.static .row-tools{right:0;}
  .tool{
    width:2rem;
    height:2rem;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    padding:0;
    color:var(--neutral-500);
    cursor:pointer;
    transition:color var(--ease-ui);
  }
  .tool svg{width:1rem;height:1rem;}
  .tool:hover{color:var(--tan-300);}
  .tool.is-set{color:var(--tan-400);}
  .tool:focus-visible{outline:2px solid var(--tan-300);outline-offset:2px;}

  .link-editor{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:.5rem;
    margin:0 0 1.125rem;
    font-family:var(--ff-inter);
    font-size:.875rem;
  }
  .link-editor[hidden]{display:none;}
  .link-editor input,
  .unlock input{
    flex:1 1 16rem;
    min-width:0;
    background:var(--navy-800);
    border:1px solid var(--tan-700);
    color:var(--neutral-100);
    font:inherit;
    padding:.625rem .75rem;
    outline:none;
    caret-color:var(--tan-300);
  }
  .link-editor input::placeholder,.unlock input::placeholder{color:var(--neutral-500);}
  .link-editor input:focus,.unlock input:focus{border-color:var(--tan-400);}
  .ghost{
    background:none;
    border:1px solid var(--tan-700);
    color:var(--tan-300);
    font:inherit;
    font-family:var(--ff-inter);
    font-size:.875rem;
    font-weight:500;
    letter-spacing:.033em;
    padding:.625rem .875rem;
    cursor:pointer;
    transition:background var(--ease-ui),color var(--ease-ui),border-color var(--ease-ui);
  }
  .ghost:hover{background:var(--tan-400);border-color:var(--tan-400);color:var(--navy-900);}
  .ghost:focus-visible{outline:2px solid var(--tan-300);outline-offset:2px;}
  .ghost.quiet{border-color:transparent;color:var(--neutral-500);}
  .ghost.quiet:hover{background:none;border-color:transparent;color:var(--tan-300);}

  .add-item{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    margin-top:.5rem;
    background:none;
    border:none;
    padding:.5rem 0;
    font-family:var(--ff-inter);
    font-size:.875rem;
    color:var(--tan-500);
    cursor:pointer;
  }
  .add-item svg{width:.875rem;height:.875rem;}
  .add-item:hover{color:var(--tan-300);}

  .edit-bar{
    position:fixed;
    left:1rem;
    bottom:1rem;
    z-index:20;
    display:flex;
    align-items:center;
    gap:.75rem;
    max-width:calc(100% - 2rem);
    background:var(--navy-800);
    border:1px solid var(--tan-700);
    padding:.5rem .5rem .5rem .875rem;
    font-family:var(--ff-inter);
    font-size:.8125rem;
    color:var(--neutral-300);
  }
  .edit-bar .status{line-height:1.5;}
  .edit-bar.is-error{border-color:#B4474B;color:var(--neutral-50);}
  .edit-bar .ghost:disabled{opacity:.5;cursor:default;}
  .unlock{
    display:flex;
    flex-wrap:wrap;
    gap:.5rem;
    margin:0 0 3rem;
    padding:1.25rem;
    border:1px solid var(--tan-700);
    font-family:var(--ff-inter);
    font-size:.875rem;
    color:var(--neutral-300);
  }
  .unlock p{flex:1 1 100%;margin:0 0 .25rem;line-height:1.6;}

  /* Save confirmation */
  .toast{
    position:fixed;
    right:1.5rem;
    bottom:1.5rem;
    background:var(--navy-800);
    border:1px solid var(--tan-700);
    color:var(--tan-300);
    font-family:var(--ff-inter);
    font-size:.75rem;
    font-weight:500;
    letter-spacing:.033em;
    padding:.75rem 1.25rem;
    opacity:0;
    transform:translateY(.5rem);
    pointer-events:none;
    transition:opacity var(--ease-ui),transform var(--ease-ui);
    z-index:60;
  }
  .toast.is-visible{opacity:1;transform:translateY(0);}
</style>

    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
  };

  var dataEl = document.getElementById("page-data");
  var data = JSON.parse(dataEl.textContent);
  var root = document.getElementById("sections");
  var toast = document.getElementById("toast");
  var toastTimer = null;
  var editing = false;
  var openIds = {};
  var previews = {};   // image path -> local data URL, until Pages publishes the file

  function flash(message) {
    toast.textContent = message;
    toast.classList.add("is-visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove("is-visible");
    }, 1800);
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) {
      node.className = className;
    }
    if (text != null) {
      node.textContent = text;
    }
    return node;
  }

  function tool(icon, label) {
    var b = el("button", "tool");
    b.type = "button";
    b.innerHTML = ICONS[icon];
    b.title = label;
    b.setAttribute("aria-label", label);
    return b;
  }

  // Read typed text back with its line breaks, ignoring CSS text-transform.
  function textOf(node) {
    var out = "";
    Array.prototype.forEach.call(node.childNodes, function (child) {
      if (child.nodeType === 3) {
        out += child.data;
      } else if (child.nodeName === "BR") {
        out += "\n";
      } else if (child.nodeType === 1) {
        if ((child.nodeName === "DIV" || child.nodeName === "P") && out && out.slice(-1) !== "\n") {
          out += "\n";
        }
        out += textOf(child);
      }
    });
    return out;
  }

  // Make a node editable in edit mode, calling onDone with its text on blur.
  function editable(node, onDone, singleLine) {
    if (!editing) {
      return;
    }
    node.setAttribute("contenteditable", "true");
    node.setAttribute("spellcheck", "true");
    node.addEventListener("click", function (event) {
      event.stopPropagation();
      if (node.closest("summary")) {
        event.preventDefault();
      }
    });
    node.addEventListener("keydown", function (event) {
      event.stopPropagation();
      if (event.key === "Enter" && singleLine) {
        event.preventDefault();
        node.blur();
      }
    });
    node.addEventListener("keyup", function (event) {
      if (node.closest("summary")) {
        event.preventDefault();
      }
    });
    // Keep pasted text plain so the brand styling holds.
    node.addEventListener("paste", function (event) {
      event.preventDefault();
      var text = (event.clipboardData || window.clipboardData).getData("text");
      document.execCommand("insertText", false, singleLine ? text.replace(/\s+/g, " ") : text);
    });
    node.addEventListener("focus", function () {
      node.setAttribute("data-entry", textOf(node));
    });
    node.addEventListener("blur", function () {
      var text = textOf(node).replace(/\n{3,}/g, "\n\n").trim();
      if (text === (node.getAttribute("data-entry") || "").trim()) {
        return;
      }
      onDone(text);
      save();
    });
  }

  /* ---- Rendering ----------------------------------------------------- */

  // Page title and date line sit outside the list, so they are wired once.
  var pageTitle = document.getElementById("page-title");
  var dateLine = document.getElementById("date-line");

  function renderHeader() {
    if (data.pageTitle == null) {
      data.pageTitle = textOf(pageTitle).trim();
    }
    if (data.dateLine == null) {
      data.dateLine = textOf(dateLine).trim();
    }
    pageTitle.textContent = data.pageTitle;
    dateLine.textContent = data.dateLine;
  }

  function wireHeader() {
    editable(pageTitle, function (text) {
      data.pageTitle = text || "Untitled";
    }, false);
    editable(dateLine, function (text) {
      data.dateLine = text;
    }, true);
  }

  function render() {
    renderHeader();
    Array.prototype.forEach.call(root.querySelectorAll("details[data-id]"), function (d) {
      if (d.open) {
        openIds[d.getAttribute("data-id")] = true;
      } else {
        delete openIds[d.getAttribute("data-id")];
      }
    });
    root.textContent = "";
    data.sections.forEach(function (section) {
      var group = el("section", "group");
      group.appendChild(el("h2", null, section.title));
      var list = el("ol");
      section.items.forEach(function (item) {
        list.appendChild(renderItem(section, item));
      });
      group.appendChild(list);
      if (editing) {
        var add = el("button", "add-item");
        add.type = "button";
        add.innerHTML = ICONS.plus + "<span>Add item</span>";
        add.addEventListener("click", function () {
          var item = {id: "item-" + Date.now().toString(36), title: "New item", link: "", description: "", images: []};
          section.items.push(item);
          openIds[item.id] = true;
          render();
          save();
          var title = root.querySelector('details[data-id="' + item.id + '"] .item-title');
          if (title) {
            title.focus();
            document.execCommand("selectAll", false, null);
          }
        });
        group.appendChild(add);
      }
      root.appendChild(group);
    });
  }

  function renderItem(section, item) {
    var li = el("li");
    var details = el("details");
    details.setAttribute("data-id", item.id);
    if (item.static) {
      details.className = "static";
      details.open = true;
    } else if (openIds[item.id]) {
      details.open = true;
    }

    var summary = el("summary");
    if (item.static) {
      summary.setAttribute("tabindex", "-1");
      summary.addEventListener("click", function (event) {
        event.preventDefault();
      });
    }

    var title;
    if (item.link && !editing) {
      title = el("a", "item-title", item.title);
      title.href = item.link;
      title.target = "_blank";
      title.rel = "noopener";
      // A link inside a summary should open the link, not toggle the row.
      title.addEventListener("click", function (event) {
        event.stopPropagation();
      });
    } else {
      title = el("span", "item-title", item.title);
    }
    editable(title, function (text) {
      item.title = text || "Untitled";
    }, true);
    summary.appendChild(title);

    if (item.images && item.images.length) {
      var thumbs = el("span", "thumbs");
      item.images.forEach(function (image) {
        var b = el("button", "thumb");
        b.type = "button";
        b.setAttribute("aria-label", image.name ? "View image: " + image.name : "View image");
        var img = el("img");
        img.src = previews[image.src] || image.src;
        img.alt = image.name || "";
        img.loading = "lazy";
        b.appendChild(img);
        b.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          openLightbox(item, image);
        });
        thumbs.appendChild(b);
      });
      summary.appendChild(thumbs);
    }

    details.appendChild(summary);
    li.appendChild(details);

    var note = el("span", "note", item.description || "");
    editable(note, function (text) {
      item.description = text;
    }, false);
    if (item.description || editing) {
      details.appendChild(note);
    }

    if (item.parts && item.parts.length) {
      var parts = el("div", "parts");
      item.parts.forEach(function (part) {
        var box = el("div", "part");
        var h = el("h3", "part-title", part.title);
        editable(h, function (text) {
          part.title = text;
        }, true);
        box.appendChild(h);
        part.lines.forEach(function (line) {
          var p = el("p", "part-line");
          if (line.label) {
            p.appendChild(el("span", "part-label", line.label));
          }
          var t = el("span", "part-text", line.text);
          editable(t, function (text) {
            line.text = text;
          }, false);
          p.appendChild(t);
          box.appendChild(p);
        });
        parts.appendChild(box);
      });
      details.appendChild(parts);
    }

    if (editing) {
      addTools(section, item, li, summary);
    }
    return li;
  }

  function addTools(section, item, li, summary) {
    var tools = el("span", "row-tools");
    var linkBtn = tool("link", item.link ? "Change link" : "Add link");
    var imageBtn = tool("image", "Add image");
    var deleteBtn = tool("trash", "Delete item");
    if (item.link) {
      linkBtn.classList.add("is-set");
    }
    tools.appendChild(linkBtn);
    tools.appendChild(imageBtn);
    tools.appendChild(deleteBtn);
    summary.appendChild(tools);

    function guard(event) {
      event.preventDefault();
      event.stopPropagation();
    }

    // Link editor sits under the row.
    var editor = el("div", "link-editor");
    editor.hidden = true;
    var input = el("input");
    input.type = "url";
    input.placeholder = "Paste a link";
    input.setAttribute("aria-label", "Link for this row");
    var saveBtn = el("button", "ghost", "Save");
    saveBtn.type = "button";
    var removeBtn = el("button", "ghost quiet", "Remove link");
    removeBtn.type = "button";
    editor.appendChild(input);
    editor.appendChild(saveBtn);
    editor.appendChild(removeBtn);
    li.appendChild(editor);

    linkBtn.addEventListener("click", function (event) {
      guard(event);
      editor.hidden = !editor.hidden;
      if (!editor.hidden) {
        input.value = item.link || "";
        input.focus();
        input.select();
      }
    });

    function setLink(url) {
      item.link = url;
      render();
      save();
    }

    saveBtn.addEventListener("click", function () {
      var url = cleanUrl(input.value);
      if (url === null) {
        flash("Use a web or email link");
        input.focus();
        return;
      }
      setLink(url);
    });
    removeBtn.addEventListener("click", function () {
      setLink("");
    });
    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        saveBtn.click();
      } else if (event.key === "Escape") {
        editor.hidden = true;
        linkBtn.focus();
      }
    });

    // Image upload: pick a file, shrink it, commit it, then name it.
    var picker = el("input");
    picker.type = "file";
    picker.accept = "image/*";
    picker.hidden = true;
    li.appendChild(picker);
    imageBtn.addEventListener("click", function (event) {
      guard(event);
      picker.click();
    });
    picker.addEventListener("change", function () {
      var file = picker.files && picker.files[0];
      picker.value = "";
      if (!file) {
        return;
      }
      flash("Uploading image");
      shrink(file).then(function (dataUrl) {
        var path = IMAGE_DIR + item.id + "-" + Date.now().toString(36) + ".jpg";
        return putFile(path, dataUrl.split(",")[1], "Add image to " + item.title).then(function () {
          previews[path] = dataUrl;
          var image = {src: path, name: "", description: ""};
          item.images = item.images || [];
          item.images.push(image);
          render();
          save();
          openLightbox(item, image);
        });
      }).catch(function (error) {
        flash(error.message || "Image upload failed");
      });
    });

    deleteBtn.addEventListener("click", function (event) {
      guard(event);
      if (!window.confirm('Delete "' + item.title + '"?')) {
        return;
      }
      section.items.splice(section.items.indexOf(item), 1);
      render();
      save();
    });
  }

  // Accept bare domains, but only http, https and mailto links.
  function cleanUrl(value) {
    var url = value.trim();
    if (!url) {
      return "";
    }
    if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) {
      url = "https://" + url;
    }
    return /^(https?:|mailto:)/i.test(url) ? url : null;
  }

  function openLightbox(item, image) {
    var overlay = el("div", "lightbox");
    var img = el("img");
    img.src = previews[image.src] || image.src;
    img.alt = image.name || "";
    overlay.appendChild(img);

    function field(className, placeholder, key) {
      var node = el("div", className, image[key] || "");
      node.setAttribute("data-placeholder", placeholder);
      if (editing) {
        editable(node, function (text) {
          image[key] = text;
          render();
        }, true);
      }
      overlay.appendChild(node);
    }
    field("lightbox-name", "Add an image name", "name");
    field("lightbox-caption", "Add a description", "description");

    if (editing) {
      var remove = el("button", "lightbox-remove", "Remove image");
      remove.type = "button";
      remove.addEventListener("click", function (event) {
        event.stopPropagation();
        item.images.splice(item.images.indexOf(image), 1);
        close();
        render();
        save();
      });
      overlay.appendChild(remove);
    }

    function close() {
      if (document.activeElement && overlay.contains(document.activeElement)) {
        document.activeElement.blur();
      }
      overlay.remove();
      document.removeEventListener("keydown", onKey);
    }
    function onKey(event) {
      if (event.key === "Escape") {
        close();
      }
    }
    overlay.addEventListener("click", close);
    document.addEventListener("keydown", onKey);
    document.body.appendChild(overlay);
  }

  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () {
        reject(new Error("Could not read that file"));
      };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () {
          reject(new Error("That file is not an image"));
        };
        img.onload = function () {
          var scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = "#030811";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.86));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ---- GitHub saving ------------------------------------------------- */

  var token = "";
  var fileSha = "";
  var fileText = "";
  var saveTimer = null;
  var saving = false;
  var pending = false;
  var retried = false;
  var dirty = false;
  var lastError = null;
  var waiters = [];
  var statusEl = null;
  var barEl = null;

  function readToken() {
    try {
      return localStorage.getItem(TOKEN_KEY) || "";
    } catch (e) {
      return "";
    }
  }

  function storeToken(value) {
    try {
      if (value) {
        localStorage.setItem(TOKEN_KEY, value);
      } else {
        localStorage.removeItem(TOKEN_KEY);
      }
    } catch (e) {}
  }

  function api(path, options) {
    options = options || {};
    options.headers = {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + token
    };
    if (options.body) {
      options.headers["Content-Type"] = "application/json";
    }
    return fetch("https://api.github.com/repos/" + REPO + path, options).then(function (res) {
      return res.json().catch(function () {
        return {};
      }).then(function (body) {
        if (!res.ok) {
          var error = new Error(body.message || ("GitHub error " + res.status));
          error.status = res.status;
          throw error;
        }
        return body;
      });
    });
  }

  function toBase64(text) {
    var bytes = new TextEncoder().encode(text);
    var binary = "";
    for (var i = 0; i < bytes.length; i += 0x8000) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(binary);
  }

  function fromBase64(b64) {
    var binary = atob(b64.replace(/\s/g, ""));
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return new TextDecoder().decode(bytes);
  }

  function putFile(path, base64, message, sha) {
    var body = {message: message, content: base64, branch: BRANCH};
    if (sha) {
      body.sha = sha;
    }
    return api("/contents/" + path, {method: "PUT", body: JSON.stringify(body)});
  }

  var DATA_BLOCK = new RegExp('(<script type="application/json" id="page-' + 'data">)([\\s\\S]*?)(</' + 'script>)');

  function pullLatest() {
    return api("/contents/" + FILE + "?ref=" + BRANCH).then(function (body) {
      fileSha = body.sha;
      fileText = fromBase64(body.content);
      var match = fileText.match(DATA_BLOCK);
      if (!match) {
        throw new Error("Could not find the content block in the saved file");
      }
      return JSON.parse(match[2]);
    });
  }

  function save() {
    if (!editing) {
      return;
    }
    dirty = true;
    setStatus("Unsaved changes");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 500);
  }

  function flush() {
    if (saving) {
      pending = true;
      return;
    }
    clearTimeout(saveTimer);
    saving = true;
    pending = false;
    dirty = false;
    setStatus("Saving");
    var json = "\n" + JSON.stringify(data, null, 2).replace(/</g, "\\u003c") + "\n";
    var next = fileText.replace(DATA_BLOCK, function (all, open, body, close) {
      return open + json + close;
    });

    putFile(FILE, toBase64(next), "Update meeting page content", fileSha).then(function (body) {
      fileSha = body.content.sha;
      fileText = next;
      retried = false;
      lastError = null;
      setStatus("Saved. Live in about a minute");
      flash("Saved");
    }).catch(function (error) {
      if ((error.status === 409 || error.status === 422) && !retried) {
        retried = true;
        // The file changed on GitHub since it was loaded. Take its latest
        // version as the base and write this page's content over it.
        return pullLatest().then(function () {
          pending = true;
        });
      }
      lastError = error;
      dirty = true;
      setStatus("Not saved. " + explain(error), true);
      flash("Not saved");
    }).then(function () {
      saving = false;
      if (pending) {
        flush();
        return;
      }
      var done = waiters;
      waiters = [];
      done.forEach(function (resolve) {
        resolve();
      });
    });
  }

  function explain(error) {
    if (error.status === 401) {
      return "GitHub rejected the token. Lock, then unlock with a new one.";
    }
    if (error.status === 403 || error.status === 404) {
      return "This token can open the repo but not save to it. It needs Contents set to Read and write for the SIG repo.";
    }
    return error.message || "Check your connection and try again.";
  }

  // Finish any edit in progress and resolve once nothing is left to save.
  function whenSaved() {
    if (document.activeElement && document.activeElement.isContentEditable) {
      document.activeElement.blur();
    }
    if (saving || pending) {
      return new Promise(function (resolve) {
        waiters.push(resolve);
      });
    }
    if (dirty) {
      return new Promise(function (resolve) {
        waiters.push(resolve);
        flush();
      });
    }
    return Promise.resolve();
  }

  function setStatus(text, isError) {
    if (statusEl) {
      statusEl.textContent = text;
      barEl.classList.toggle("is-error", !!isError);
    }
  }

  window.addEventListener("beforeunload", function (event) {
    if (editing && (dirty || saving || pending)) {
      event.preventDefault();
      event.returnValue = "";
    }
  });

  function showEditBar() {
    var bar = el("div", "edit-bar");
    barEl = bar;
    statusEl = el("span", "status", "Editing. Changes save to GitHub");
    var done = el("button", "ghost quiet", "Lock");
    done.type = "button";
    // Lock waits for every save to land, then leaves edit mode in place so
    // the page keeps showing the edits while GitHub Pages republishes.
    done.addEventListener("mousedown", function (event) {
      event.preventDefault();
    });
    done.addEventListener("click", function () {
      done.disabled = true;
      setStatus("Saving before locking");
      whenSaved().then(function () {
        if (lastError) {
          done.disabled = false;
          setStatus("Not saved, so the page is still unlocked. " + explain(lastError), true);
          return;
        }
        storeToken("");
        token = "";
        editing = false;
        document.body.classList.remove("editing");
        [pageTitle, dateLine].forEach(function (node) {
          node.removeAttribute("contenteditable");
        });
        bar.remove();
        statusEl = null;
        history.replaceState(null, "", window.location.pathname);
        render();
        flash("Locked. Edits are live in a few minutes");
      });
    });
    bar.appendChild(statusEl);
    bar.appendChild(done);
    document.body.appendChild(bar);
  }

  function showUnlock(message) {
    var slot = document.getElementById("unlock-slot");
    slot.textContent = "";
    var form = el("form", "unlock");
    form.appendChild(el("p", null, message || "Paste your GitHub token to edit this page. It stays in this browser only."));
    var input = el("input");
    input.type = "password";
    input.placeholder = "GitHub token";
    input.autocomplete = "off";
    input.setAttribute("aria-label", "GitHub token");
    var go = el("button", "ghost", "Unlock");
    go.type = "submit";
    form.appendChild(input);
    form.appendChild(go);
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      unlock(input.value.trim());
    });
    slot.appendChild(form);
    input.focus();
  }

  function unlock(value) {
    if (!value) {
      return;
    }
    token = value;
    api("").then(function (repo) {
      if (!repo.permissions || !repo.permissions.push) {
        throw new Error("That token cannot write to the SIG repo.");
      }
      return pullLatest();
    }).then(function (latest) {
      storeToken(value);
      data = latest;
      editing = true;
      document.body.classList.add("editing");
      document.getElementById("unlock-slot").textContent = "";
      showEditBar();
      wireHeader();
      render();
    }).catch(function (error) {
      token = "";
      storeToken("");
      showUnlock(error.message === "Bad credentials" ? "That token was not accepted. Try again." : error.message);
    });
  }

  render();

  window.addEventListener("hashchange", function () {
    if (window.location.hash === "#edit" && !editing) {
      window.location.reload();
    }
  });

  if (window.location.hash === "#edit") {
    var saved = readToken();
    if (saved) {
      unlock(saved);
    } else {
      showUnlock();
    }
  }
})();
</script>
</body>
</html>
